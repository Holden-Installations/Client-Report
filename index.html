// Programme headline: planned, actual (behind = blue, on track = green), worst delay, tasks behind
function progLook(c) {
  const behind = c.actual < c.planned;
  return { aC: behind ? '#0073EA' : '#2D2D2D', aBar: behind ? '#0073EA' : '#00C875', dC: c.worstDelay > 0 ? '#D83A52' : '#1E7A46' };
}
// Package status chip, as on the mockup
function pkgStatus(s, d) {
  if (s === 'done') return { t: 'Complete', bg: '#E3F1E8', fg: '#1E5E39' };
  if (s === 'behind') return { t: `⚠ ${(Number(d) || 0).toFixed(1)} days late`, bg: '#D83A52', fg: '#FFFFFF' };
  if (s === 'notstarted') return { t: 'Not started', bg: '#ECEEF1', fg: '#3B4452' };
  return { t: 'On track', bg: '#E3F1E8', fg: '#1E5E39' };
}
// The rows of the Site installation table: each package, then All packages (from the week's totals)
// "+ 29 more packages: 20 complete, 9 not started"
function moreText(m) {
  if (!m || !m.n) return '';
  const parts = [['behind', 'behind'], ['ontrack', 'in progress'], ['notstarted', 'not started'], ['done', 'complete']].filter(([k]) => m[k]).map(([k, w]) => `${m[k]} ${w}`);
  return `+ ${m.n} more ${m.n === 1 ? 'package' : 'packages'}${parts.length ? ': ' + parts.join(', ') : ''}`;
}
// Site installation shows at most CONFIG.siteMaxPackages packages: all of them in programme order when there are
// that few; otherwise the ones that matter most (behind, most days late first; then in progress; then not started).
// The rest are counted by status in a "+ N more packages" line.
function siteRows(c) {
  const all = (c.packages && c.packages.rows) || [], MAX = CONFIG.siteMaxPackages || 5;

  let pick = all;
  if (all.length > MAX) {
    const rank = { behind: 0, ontrack: 1, notstarted: 2, done: 3 };
    pick = all.slice().sort((x, y) => (rank[x.s] ?? 4) - (rank[y.s] ?? 4) || (y.d || 0) - (x.d || 0) || all.indexOf(x) - all.indexOf(y)).slice(0, MAX);
    all.filter(x => !pick.includes(x)).forEach(x => { more.n++; more[x.s] = (more[x.s] || 0) + 1; });
  }
  const rows = pick.map(x => ({ n: x.n, p: x.p, a: x.a, behind: x.s === 'behind', st: pkgStatus(x.s, x.d) }));
  const moreLine = moreText(more);
  if (moreLine) rows.push({ more: moreLine });

  rows.push({ n: 'All packages', p: Math.round(c.planned), a: Math.round(c.actual), behind: allStatus === 'behind', st: pkgStatus(allStatus, c.worstDelay), total: true });

}

function chartHTML(f, ctx) {
  const hist = f.prog.history, n = hist.length, slots = Math.max(n + 2, 4);

  const X = i => (i + 0.5) / slots * 1000, Y = v => 300 - clamp(v) * 3;
  const line = k => hist.map((h, i) => `${X(i).toFixed(1)},${Y(h[k]).toFixed(1)}`).join(' ');
  const aheadLine = ahead.length ? [`${X(n - 1).toFixed(1)},${Y(hist[n - 1].p).toFixed(1)}`].concat(ahead.map((x, k) => `${X(n + k).toFixed(1)},${Y(x.p).toFixed(1)}`)).join(' ') : '';
  const sx = X(n - 1);
  const dot = (h, i, k, style) => `<div style="position: absolute; left: ${X(i) / 10}%; top: ${Y(h[k]) / 3}%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; ${style}"></div>`;
  const dates = hist.map(h => parseISO(h.w)).concat([1, 2].map(k => addDays(parseISO(hist[n - 1].w), 7 * k)));
  while (dates.length < slots) dates.push(addDays(dates[dates.length - 1], 7));
  const every = slots > 12 ? 2 : 1;
  const labels = dates.map((d, i) => `<span>${i % every === 0 ? d.getDate() + '/' + (d.getMonth() + 1) : ''}</span>`).join('');
  return `<div style="display: grid; grid-template-columns: 38px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 6px; flex: 1; min-height: 0">
      <div style="display: flex; flex-direction: column; justify-content: space-between; font-size: 11.5px; color: #5B6472; text-align: right; padding-bottom: 20px"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div>

          <svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" role="img" aria-label="Planned and actual percent complete by week">
            <line x1="${sx}" y1="0" x2="${sx}" y2="300" stroke="#9AA7B1" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></line>
            <polyline points="${line('p')}" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"></polyline>
            <polyline points="${line('a')}" fill="none" stroke="#0073EA" stroke-width="3" vector-effect="non-scaling-stroke"></polyline>
            ${aheadLine ? `<polyline points="${aheadLine}" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"></polyline>` : ''}
          </svg>
          ${ahead.map((x, k) => dot({ p: x.p }, n + k, 'p', 'background: #fff; border: 2px solid #2D2D2D; box-sizing: border-box')).join('')}
          ${ahead.map((x, k) => `<div class="pv-hit" style="left: ${(n + k) / slots * 100}%; width: ${100 / slots}%"><div class="pv-tip" style="right: 50%; transform: translateX(10px)">
              <b>Week ending ${esc(fDMY(parseISO(x.w)))}</b><br>Planned ${Math.round(x.p)}% (programme)<br>Actual not yet reported</div></div>`).join('')}
          ${hist.map((h, i) => dot(h, i, 'p', 'background: #fff; border: 2px solid #2D2D2D; box-sizing: border-box')).join('')}

            const v = Math.round(h.a) - Math.round(h.p), side = i / slots > 0.6 ? 'right: 50%; transform: translateX(10px)' : i / slots < 0.25 ? 'left: 50%; transform: translateX(-10px)' : 'left: 50%; transform: translateX(-50%)';

      </div>
    </div>`;
}

const BODY_H = 540;   // slide body height in px (720 minus header and footer)
function fitRows(rows, fixed) {
  const h = rows ? Math.floor((BODY_H - fixed) / rows) : 26;
  const size = Math.max(16, Math.min(26, h));
  return { h: size, font: size >= 22 ? 13 : size >= 19 ? 12 : 11, input: Math.max(14, size - 4), over: rows * 16 > BODY_H - fixed };
}
function resourcesBody(ctx, s) {

  const L = fitRows(shown(resRows).length + shown(plantRows).length, 2 * 30 + 12 + (ed ? 2 * 30 : 0) + 6);
  // a cell's value: what was typed, else the default row (role names before anything is entered)

function slideHTML(s, ctx) {

function renderStage(ctx) {

  const views = state.mode === 'all' ? ctx.slides : [ctx.slides[state.page]].filter(Boolean);

const isLocked = r => !!r && [CONFIG.statusLabels.issued, CONFIG.statusLabels.superseded].includes(r.status);
// Speed check: how long each part of opening a report took (console, and ClientReport.timings)
const timings = [];
let firstOpen = true;
function logTiming(t) {
  timings.push(t); if (timings.length > 20) timings.shift();
  console.info(LOG, `Report opened in ${t.total} ms (content ${t.content} ms, figures ${t.figures} ms, images ${t.images} ms)`);
  if (firstOpen) { firstOpen = false; t.sincePageOpened = Math.round(performance.now()); console.info(LOG, `First report ready ${t.sincePageOpened} ms after the page started (app code started at ${T_CODE} ms, projects and reports ready at ${T_LISTS} ms)`); }
}
// At start-up the last report's content is read before the lists of projects and reports have arrived (see init)
let warm = null;
async function openReport(id) {
  state.report = id || ''; state.content = null; state.contentError = ''; state.figs = null; state.figsError = '';
  state.edits = null; state.savedText = {}; state.editing = false; state.files = null; state.frozen = null;
  if (!state.report) { render(); return; }
  const token = state.report, p = curProject(), r = curReport(), locked = isLocked(r);
  const t0 = performance.now(), T = { report: r ? `${r.no}${r.revision ? ' rev ' + r.revision : ''}` : '', content: null, figures: null, images: null };
  let imagesPending = false;
  const done = () => { if (state.report !== token || T.total != null || T.figures == null || T.content == null || imagesPending) return; T.total = Math.round(performance.now() - t0); logTiming(T); };
  state.contentLoading = true; render();
  // the report's saved content and its figures load at the same time (an issued report: its frozen figures)
  const figsP = p && r && !locked ? loadFigures(p, r) : Promise.resolve(null);
  if (r && !locked) { const fp = reloadFiles(r); if (fp) { imagesPending = true; const got = () => { T.images = Math.round(performance.now() - t0); imagesPending = false; done(); }; fp.then(got, got); } }
  let c = null;
  const contentP = warm && warm.id === token ? warm.p : loadContent(token); warm = null;
  try { c = await contentP; if (state.report === token) { state.content = c; state.edits = editsFrom(c); state.savedText = snapshotOf(state.edits); } }
  catch (e) { if (state.report === token) state.contentError = e.message || String(e); }
  if (state.report !== token) return;
  T.content = Math.round(performance.now() - t0);
  state.contentLoading = false; render();
  if (locked && c) {
    const I = CONFIG.kinds.issued, figs = (c.sections.figures || {})[I], meta = (c.sections.frozen || {})[I];
    if (meta) { state.frozen = Object.assign({ reportId: token }, meta); loadFrozenFiles(token, meta.files); }
    else reloadFiles(r);
    if (figs) { state.figs = Object.assign({}, figs, { frozen: true, issuedAt: meta && meta.issuedAt }); T.figures = 0; done(); render(); return; }
    // issued before freezing existed: show the figures as they are now
    try { const f = await loadFigures(p, r); if (state.report === token) state.figs = f; }
    catch (e) { if (state.report === token) state.figsError = e.message || String(e); }
    if (state.report === token) render();
    return;
  }
  try { const f = await figsP; if (state.report === token) state.figs = f; }

async function saveDraft() {

    const fresh = await loadContent(r.id);
    const serverText = k => { const x = (fresh.sections[k] || {})[CONFIG.kinds.edits]; return x === undefined ? undefined : JSON.stringify(x); };
    const clashes = keys.filter(k => serverText(k) !== state.savedText[k]);

    state.content = after; state.savedText = snapshotOf(latest);

// Slide list: open, reorder, hide, duplicate (with its typed-in content), remove a copy
function slideAction(act, id, i) {
  const ctx = context(); if (!ctx) return;
  if (act === 'go') { state.mode = 'slides'; state.page = i; render(); return; }
  const at = currentLayout().slides.findIndex(s => s.id === id);
  if (at < 0) return;
  if (act === 'up' || act === 'down') {
    const to = act === 'up' ? at - 1 : at + 1;
    setLayout(L => { const t = L.slides[at]; L.slides[at] = L.slides[to]; L.slides[to] = t; });
    state.page = to;
  } else if (act === 'hide') {
    setLayout(L => { L.hidden[id] = !L.hidden[id]; });
  } else if (act === 'dup') {
    const src = currentLayout().slides[at], nid = newSlideId(src.type);
    setLayout(L => { L.slides.splice(at + 1, 0, { id: nid, type: src.type }); });
    if (state.edits[id] !== undefined) state.edits[nid] = deepCopy(state.edits[id]);
    state.page = at + 1; state.mode = 'slides';
  } else if (act === 'remove') {
    setLayout(L => { L.slides = L.slides.filter(s => s.id !== id); });
    state.edits[id] = undefined;
    state.page = Math.max(0, at - 1);
  }
  render();
}

/* ================= Look-ahead: tasks planned in the next weeks, from the project board ================= */
// Tracked tasks are found as the programme snapshot finds them: the lowest rows with an Install / Installations row above.
// Dates: Latest Baseline, else Original Baseline, else Timeline. Complete tasks (Actual 100%) are left out.
const LA_MAX = 8;   // tasks listed per week; the rest are counted in a last line
async function loadProgrammeTasks(boardId) {
  const meta = await gql('query ($b: [ID!]) { boards(ids: $b, hierarchy_types: [classic, multi_level]) { id columns { id title type } } }', { b: [String(boardId)] });
  const b = (meta.boards || [])[0];
  if (!b) throw new Error('The project board could not be read.');
  const norm = s => String(s || '').trim().toLowerCase();
  const tl = (id, title) => b.columns.find(c => c.type === 'timeline' && (c.id === id || c.id.endsWith('__' + id))) || b.columns.find(c => c.type === 'timeline' && norm(c.title) === norm(title));
  const cols = { latest: tl('timerange_mm8b45mv', 'Latest Baseline'), original: tl('timerange_mm8bx25a', 'Original Baseline'), timeline: tl('', 'Timeline'),
    actual: b.columns.find(c => c.id === 'numeric_mm85vp3d') || b.columns.find(c => norm(c.title) === 'actual %') };
  const ids = Object.values(cols).filter(Boolean).map(c => c.id);
  const F = `cursor items { id name parent_item { id } column_values(ids: $c, capabilities: [CALCULATED]) { id text value ... on TimelineValue { from to } ... on NumbersValue { number } } }`;
  let d = await gql(`query ($b: [ID!], $c: [String!]) { boards(ids: $b, hierarchy_types: [classic, multi_level]) { items_page(limit: 500, hierarchy_scope_config: "allItems") { ${F} } } }`, { b: [String(boardId)], c: ids });
  let page = d.boards[0].items_page, items = page.items;
  while (page.cursor) { d = await gql(`query ($cur: String!, $c: [String!]) { next_items_page(limit: 500, cursor: $cur) { ${F} } }`, { cur: page.cursor, c: ids }); page = d.next_items_page; items = items.concat(page.items); }
  const cv = (it, c) => c && (it.column_values || []).find(v => v.id === c.id);
  const dates = v => { if (!v) return null; let f = v.from, t = v.to; if (!f || !t) { try { const j = JSON.parse(v.value || 'null'); if (j) { f = j.from; t = j.to; } } catch (e) {} } return f && t ? [String(f).slice(0, 10), String(t).slice(0, 10)] : null; };
  const byId = {}, kids = {};
  items.forEach(it => { byId[it.id] = it; if (it.parent_item) kids[it.parent_item.id] = 1; });
  const out = [];
  items.forEach(it => {
    if (kids[it.id]) return;
    const chain = []; let p = it.parent_item && byId[it.parent_item.id], g = 0;
    while (p && g++ < 12) { chain.unshift(p.name); p = p.parent_item && byId[p.parent_item.id]; }
    if (!chain.some(n => /^install(ation)?s?$/i.test(String(n).trim()))) return;
    const span = dates(cv(it, cols.latest)) || dates(cv(it, cols.original)) || dates(cv(it, cols.timeline));
    const a = cv(it, cols.actual), actual = a ? (typeof a.number === 'number' ? a.number : num(a.text)) : 0;
    if (!span || actual >= 100) return;
    out.push({ label: chain.filter(n => !/^install/i.test(String(n).trim())).concat([it.name]).join(' › '), from: span[0], to: span[1] });
  });
  return out;
}
async function fillLookahead(sid) {
  const p = curProject(), r = curReport(), per = r && periodOf(r);
  if (!p || !per) return;
  if (!p.boardId) { msg(`${p.code} has no Project Board ID on the Projects board, so its programme can't be read.`); return; }
  const e = E(sid);
  if ((e.w || []).some(x => String(x || '').trim()) && !await ask('Replace the planned lists with the tasks from the programme?', 'Replace', 'Cancel')) return;
  msg('Reading the programme…');
  try {
    const tasks = await loadProgrammeTasks(p.boardId);
    const lists = per.next.map(mon => {
      const from = iso(mon), to = iso(addDays(mon, 6));
      const due = tasks.filter(t => t.from <= to && t.to >= from).sort((a, b) => a.from.localeCompare(b.from) || a.label.localeCompare(b.label));
      const lines = due.slice(0, LA_MAX).map(t => t.label);
      if (due.length > LA_MAX) lines.push(`+ ${due.length - LA_MAX} more tasks`);
      return lines.join('\n');
    });
    lists.forEach((txt, i) => setPath(sid, ['w', i], txt));
    render();
    const n = lists.reduce((a, l) => a + (l ? l.split('\n').length : 0), 0);
    msg(n ? 'Planned lists filled from the programme. Edit them as needed, then save.' : 'No tasks are planned in those weeks on the programme.');
  } catch (err) { msg('Could not read the programme: ' + (err.message || err)); }
}

/* ================= Download PDF: one 16:9 page per slide in the report ================= */
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => fail(new Error('Could not load ' + src)); document.head.appendChild(s);
  });
}
// The slides as the client sees them: no edit boxes, no hidden slides, no "Nothing added yet" hints
function exportContext() {
  const ctx = context(); if (!ctx) return null;
  const deco = decorate(currentLayout(), false);
  return Object.assign({}, ctx, { editing: false, slides: deco.list, contents: deco.contents });
}
const blobToDataURL = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
// Images are copied into the page, then drawn as backgrounds so photos stay cropped (html2canvas ignores object-fit).
// Copies bypass the browser cache (a cached copy of an image shown on screen can't be reused for the PDF);
// if that fails, monday is asked for a fresh link. Returns the names of images that still couldn't be added.
async function copyImage(img) {   // img: an <img>, or { src, dataset: { asset } }
  const tryFetch = async url => { const r = await fetch(url, { mode: 'cors', cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return blobToDataURL(await r.blob()); };
  try { return await tryFetch(img.src); }
  catch (e) {
    const id = img.dataset.asset;
    if (!id) throw e;
    const d = await gql('query ($i: [ID!]!) { assets(ids: $i) { id public_url } }', { i: [id] });
    const fresh = ((d.assets || [])[0] || {}).public_url;
    if (!fresh) throw e;
    return tryFetch(fresh);
  }
}
async function prepareImages(root) {
  const failed = [];
  const imgs = [...root.querySelectorAll('img')];
  await Promise.all(imgs.map(async img => {
    if (!/^data:/.test(img.getAttribute('src') || '')) {
      try { img.src = await copyImage(img); }
      catch (e) { console.warn(LOG, 'Image could not be added to the PDF', img.alt, e); failed.push(img.alt || 'an image'); img.remove(); return; }
    }
    const fit = img.style.objectFit;
    if (fit === 'cover' || fit === 'contain') {
      const d = document.createElement('div');
      d.style.cssText = `position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-image: url("${img.src}"); background-position: center; background-size: ${fit}; background-repeat: no-repeat`;
      img.replaceWith(d);
    }
  }));
  await Promise.all([...root.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));
  return failed;
}
async function exportPdf() {
  const r = curReport(), p = curProject();
  if (!r || !p || state.busy) return;
  const btn = $('pdfBtn');
  if (!state.figs && !state.figsError) { msg('The figures are still loading. Try again in a moment.'); return; }
  btn.disabled = true; msg('Preparing PDF…');
  let area = null;
  try {
    if (!state.files) await reloadFiles(r);
    const ctx = exportContext();
    area = document.createElement('div'); area.id = 'exportArea';
    area.innerHTML = ctx.slides.map(s => slideHTML(s, ctx)).join('');
    document.body.appendChild(area);
    // slides that show an error or are still loading: check before exporting
    const pages = [...area.querySelectorAll('section.slide')];
    const issues = ctx.slides.filter((s, i) => pages[i] && pages[i].querySelector('.err, .note')).map(s => s.tab);
    if (issues.length && !await ask(`These slides show a problem or missing data: ${issues.join(', ')}. Download the PDF anyway?`, 'Download anyway', 'Cancel')) { msg(''); return; }
    await Promise.all([loadScript(CONFIG.pdf.libs.html2canvas), loadScript(CONFIG.pdf.libs.jspdf), document.fonts ? document.fonts.ready : null]);
    const failedImages = await prepareImages(area);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [960, 540], compress: true });
    for (let i = 0; i < pages.length; i++) {
      msg(`Preparing PDF… page ${i + 1} of ${pages.length}`);
      const canvas = await window.html2canvas(pages[i], { scale: CONFIG.pdf.scale, backgroundColor: '#ffffff', useCORS: true, logging: false, width: 1280, height: 720 });
      if (i) pdf.addPage([960, 540], 'landscape');
      pdf.addImage(canvas.toDataURL('image/jpeg', CONFIG.pdf.quality), 'JPEG', 0, 0, 960, 540);
    }
    const n = ctx.per ? ctx.per.weeks : CONFIG.period.defaultWeeks;
    pdf.save(`${p.code} ${cadenceName(n)} Progress Report - Report ${r.no}${r.revision ? ' rev ' + r.revision : ''}.pdf`);
    msg(`PDF downloaded (${pages.length} pages).` + (failedImages.length ? ` These images could not be added: ${failedImages.join(', ')}. Try again, or use Refresh first.` : ''));
  } catch (e) { msg('PDF export failed: ' + (e.message || e)); console.error(LOG, e); }
  finally { if (area) area.remove(); btn.disabled = false; }
}

/* ================= Download PowerPoint (editable) =================
   Every slide is rebuilt with native PowerPoint parts: text boxes, tables, shapes, images and a line chart,
   placed with the same measurements as the slides. Slides are 1280 × 720 px; PowerPoint's wide layout is
   13.33 × 7.5 in, so 96 px = 1 inch and text sizes convert at 0.75 pt per px. */
const IN = px => +(px / 96).toFixed(4);
const PT = px => +(px * 0.75).toFixed(2);
const HEX = c => String(c || '#2D2D2D').replace('#', '').toUpperCase();
const PX = { L: 48, W: 1184, TOP: 118, BOTTOM: 658, LEFT_W: 701, RIGHT_X: 779, RIGHT_W: 453 };

function pText(sl, text, x, y, w, h, o) {
  o = o || {};
  sl.addText(text, { x: IN(x), y: IN(y), w: IN(w), h: IN(h), fontFace: CONFIG.pptx.font, fontSize: PT(o.size || 14), bold: !!o.bold,
    color: HEX(o.color), align: o.align || 'left', valign: o.valign || 'top', margin: 0, charSpacing: o.spacing || 0, italic: !!o.italic });
}
function pRect(sl, x, y, w, h, fill, o) {
  o = o || {};
  sl.addShape(o.radius ? 'roundRect' : 'rect', { x: IN(x), y: IN(y), w: IN(w), h: IN(h),
    fill: fill ? { color: HEX(fill) } : { type: 'none' },
    line: o.line ? { color: HEX(o.line), width: o.lineW || 0.75, dashType: o.dash ? 'dash' : 'solid' } : { type: 'none' },
    rectRadius: o.radius ? Math.min(0.5, o.radius / Math.min(w, h)) : undefined });
}
// Progress bar: grey track, coloured fill, optional black tick for "planned"
function pBar(sl, x, y, w, pct, color, tick, h) {
  h = h || 8;
  pRect(sl, x, y, w, h, '#E6E9ED', { radius: h / 2 });
  const fw = w * clamp(pct) / 100;
  if (fw > 0.5) pRect(sl, x, y, Math.max(fw, h), h, color || '#0B6A82', { radius: h / 2 });
  if (tick != null) pRect(sl, x + w * clamp(tick) / 100 - 1, y - 4, 2, h + 8, '#2D2D2D');
}
// Bulleted lines (one paragraph each), or nothing when empty
function pBullets(sl, lines, x, y, w, h, size) {
  if (!lines.length) return;
  sl.addText(lines.map((l, i) => ({ text: l, options: { bullet: { indent: PT(16) }, breakLine: i < lines.length - 1, paraSpaceAfter: PT(7) } })),
    { x: IN(x), y: IN(y), w: IN(w), h: IN(h), fontFace: CONFIG.pptx.font, fontSize: PT(size || 14), color: '2D2D2D', valign: 'top', margin: 0, lineSpacingMultiple: 1.1 });
}
function pCard(sl, x, y, w, h, title, lines) {
  pRect(sl, x, y, w, h, '#F7F8FA', { line: '#E6E9ED', radius: 8 });
  pText(sl, title.toUpperCase(), x + 18, y + 14, w - 36, 18, { size: 12.5, bold: true, color: '#0B6A82', spacing: 0.75 });
  pBullets(sl, lines, x + 18, y + 42, w - 36, h - 56, 14);
}
function pHeader(sl, s, ctx) {
  sl.addImage({ data: LOGO, x: IN(48), y: IN(30), w: IN(30), h: IN(38) });
  const n = ctx.per ? ctx.per.weeks : CONFIG.period.defaultWeeks;
  const k = s.type === 'lookahead' || s.type === 'resources' ? nextWeeks(n) : SUBKICK[s.type];
  pText(sl, `${ctx.code} | Report ${ctx.no}${k ? ' | ' + k : ''}`.toUpperCase(), 94, 30, 1100, 16, { size: 11.5, bold: true, color: '#5B6472', spacing: 0.9 });
  pText(sl, s.title, 94, 46, 1100, 36, { size: 28, bold: true });
  pRect(sl, 48, 84, 1184, 3, '#44C8E8');
}
function pFooter(sl, ctx) {
  pRect(sl, 48, 680, 1184, 1, '#E6E9ED');

// Table in the slides' style: white header row in grey text, light borders, a coloured bar down the left.
// cells: strings or { text, bold, align, color }. Returns the table's height in px.
function pTable(sl, x, y, colW, head, rows, o) {
  o = o || {};
  const headH = o.headH || 32, rowH = o.rowH || 38, size = o.size || 14, accent = o.accent;
  const ax = accent ? 6 : 0;
  const cell = (c, isHead, i) => {
    const v = typeof c === 'object' && c !== null ? c : { text: c };
    return { text: String(v.text == null ? '' : v.text), options: { bold: !!v.bold, color: HEX(v.color || (isHead ? '#676879' : '#2D2D2D')),
      align: v.align || (i === 0 ? 'left' : 'center'), fontSize: PT(isHead ? (o.headSize || 12.5) : size), fill: { color: 'FFFFFF' } } };
  };
  const data = [head.map((c, i) => cell(c, true, i))].concat(rows.map(r => r.map((c, i) => cell(c, false, i))));
  sl.addTable(data, { x: IN(x + ax), y: IN(y), colW: colW.map(IN), rowH: [IN(headH)].concat(rows.map(() => IN(rowH))),
    fontFace: CONFIG.pptx.font, valign: 'middle', margin: [0, 0.08, 0, 0.1], border: { type: 'solid', pt: 0.75, color: 'E6E9EF' } });
  const h = headH + rows.length * rowH;
  if (accent) pRect(sl, x, y, 6, h, accent);
  return h;
}
// Bars drawn over a table's "Progress" column (row heights are fixed, so positions are known)
function pBarsInColumn(sl, x, y, colW, col, headH, rowH, pcts, color) {
  const cx = x + 6 + colW.slice(0, col).reduce((a, b) => a + b, 0), w = colW[col];
  pcts.forEach((pc, i) => { if (pc != null) pBar(sl, cx + 10, y + headH + i * rowH + rowH / 2 - 4, w - 62, pc, color); });
}
const pPct = pc => pc == null ? '–' : { text: pc + '%', align: 'right', color: '#5B6472' };
const pPlaceholder = (sl, x, y, w, h, title, sub) => {
  pRect(sl, x, y, w, h, '#F2F4F6', { line: '#9AA7B1', lineW: 1.5, dash: true, radius: 6 });
  pText(sl, title, x + 10, y + h / 2 - (sub ? 20 : 10), w - 20, 22, { size: h > 200 ? 18 : 14, bold: true, color: '#3B4A56', align: 'center', valign: 'middle' });
  if (sub) pText(sl, sub, x + 10, y + h / 2 + 4, w - 20, 20, { size: h > 200 ? 14 : 12.5, color: '#3B4A56', align: 'center', valign: 'middle' });
};
// Image fitted into a box: "contain" shows it whole; "cover" fills the box and crops the overflow
function pImage(sl, info, x, y, w, h, fit) {
  if (!info) return;
  const r = info.w / info.h;
  if (fit === 'contain') {
    let iw = w, ih = w / r; if (ih > h) { ih = h; iw = h * r; }
    sl.addImage({ data: info.data, x: IN(x + (w - iw) / 2), y: IN(y + (h - ih) / 2), w: IN(iw), h: IN(ih) });
  } else {
    let iw = w, ih = w / r; if (ih < h) { ih = h; iw = h * r; }
    sl.addImage({ data: info.data, x: IN(x), y: IN(y), w: IN(iw), h: IN(ih), sizing: { type: 'crop', x: IN((iw - w) / 2), y: IN((ih - h) / 2), w: IN(w), h: IN(h) } });
  }
}

// Every image the deck uses, as data with its size: cover, drawings, photos
async function collectImages(ctx) {
  const F = ctx.files; if (!F) return { images: {}, failed: [] };
  const list = [F.cover, newest(F.cur.markup), newest(F.cur.keyPlan), newest(F.cur.lookahead)].concat(F.cur.photos || []).filter(Boolean);
  const images = {}, failed = [];
  await Promise.all(list.map(async a => {
    try {
      const data = await copyImage({ src: a.url, dataset: { asset: a.id } });
      const size = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok({ w: im.naturalWidth, h: im.naturalHeight }); im.onerror = no; im.src = data; });
      images[a.id] = Object.assign({ data }, size);
    } catch (e) { console.warn(LOG, 'Image could not be added to the PowerPoint', a.name, e); failed.push(a.name); }
  }));
  return { images, failed };
}
async function exportPptx() {
  const r = curReport(), p = curProject();
  if (!r || !p || state.busy) return;
  if (!state.figs && !state.figsError) { msg('The figures are still loading. Try again in a moment.'); return; }
  const btn = $('pptBtn'); btn.disabled = true; msg('Preparing PowerPoint…');
  try {
    if (!state.files) await reloadFiles(r);
    const ctx = exportContext(), f = state.figs || { errors: { all: state.figsError }, weeks: ctx.per ? ctx.per.weeks : 2 };
    await loadScript(CONFIG.pptx.lib);
    const X = await collectImages(ctx);
    const pres = new window.PptxGenJS();
    pres.layout = 'LAYOUT_WIDE';
    pres.author = 'Holden'; pres.company = 'Holden';
    pres.title = `${p.code} ${cadenceName(ctx.per ? ctx.per.weeks : 2)} Progress Report - Report ${r.no}`;
    ctx.slides.forEach((s, i) => {
      msg(`Preparing PowerPoint… slide ${i + 1} of ${ctx.slides.length}`);
      const sl = pres.addSlide();
      sl.background = { color: 'FFFFFF' };
      const build = PPT[s.type];
      if (s.type !== 'cover') pHeader(sl, s, ctx);

  btn.disabled = false;

/* ================= Issue report (Phase 5) =================
   Freezes the report: its figures, the project details and the images used, saved as "Issued data" on the report item.
   Sets Report Status = Issued, Issued On = today, Issued By = you. Issued reports open from the frozen copy and can't be edited.
   Issuing a revision marks the earlier issued revision of the same report Superseded. */
// Slides that show a problem or missing data, as the client would see them
function slidesWithProblems() {
  const ctx = exportContext(); if (!ctx) return [];
  const area = document.createElement('div'); area.id = 'exportArea';
  area.innerHTML = ctx.slides.map(s => slideHTML(s, ctx)).join('');
  document.body.appendChild(area);
  const pages = [...area.querySelectorAll('section.slide')];
  const out = ctx.slides.filter((s, i) => pages[i] && pages[i].querySelector('.err, .note')).map(s => s.tab);
  area.remove();
  return out;
}
async function setReportColumns(itemId, vals) {
  await gql('mutation ($b: ID!, $i: ID!, $v: JSON!) { change_multiple_column_values(board_id: $b, item_id: $i, column_values: $v) { id } }',
    { b: String(CONFIG.boards.reports), i: String(itemId), v: JSON.stringify(vals) });
}
async function issueReport() {
  const r = curReport(), p = curProject();
  if (!r || !p || !canEdit(r) || state.busy) return;
  if (!state.figs) { msg(state.figsError ? 'The figures could not be loaded, so the report can\'t be issued yet.' : 'The figures are still loading. Try again in a moment.'); return; }
  if (isDirty()) {
    if (!await ask('Save your changes first?', 'Save and continue', 'Cancel')) return;
    await saveDraft();
    if (isDirty()) { msg('The changes could not be saved, so the report was not issued.'); return; }
  }
  if (!state.files) await reloadFiles(r);
  const issues = slidesWithProblems(), name = `Report ${r.no}${r.revision ? ' rev ' + r.revision : ''}`;
  const text = `Issue ${name}?\n\nThe report will be locked and won't change. To make changes later, create a revision.`
    + (issues.length ? `\n\nMissing data on: ${issues.join(', ')}.` : '');
  if (!await ask(text, 'Issue report', 'Cancel')) return;
  state.busy = true; msg('Issuing…'); render();
  try {
    const me = ((await gql('query { me { id name } }')) || {}).me || {};
    const F = state.files || { cur: {} }, removed = E('photoMeta').removed || [];
    const one = k => { const a = newest(F.cur[k]); return a ? [a.id] : []; };
    const meta = {
      issuedAt: new Date().toISOString(), issuedBy: me.name || '',
      project: { name: p.name, code: p.code, client: p.client, pmNames: p.pmNames },
      files: { cover: F.cover ? { id: F.cover.id, from: F.coverFrom || null } : null, markup: one('markup'), keyPlan: one('keyPlan'), lookahead: one('lookahead'),
        photos: (F.cur.photos || []).filter(a => !removed.includes(a.id)).map(a => a.id) }
    };
    const store = await loadContent(r.id), I = CONFIG.kinds.issued;
    const figs = Object.assign({}, state.figs); delete figs.frozen; delete figs.issuedAt;
    await saveSection(store, 'figures', I, figs, { reload: false });
    await saveSection(store, 'frozen', I, meta, { reload: false });
    const R = CONFIG.report, vals = { [R.status]: { label: CONFIG.statusLabels.issued }, [R.issuedOn]: { date: iso(new Date()) } };
    if (me.id) vals[R.issuedBy] = { personsAndTeams: [{ id: Number(me.id), kind: 'person' }] };
    await setReportColumns(r.id, vals);
    // an earlier issued revision of this report is now superseded
    for (const x of state.reports.filter(x => x.projectId === r.projectId && x.no === r.no && x.revision < r.revision && x.status === CONFIG.statusLabels.issued))
      await setReportColumns(x.id, { [R.status]: { label: CONFIG.statusLabels.superseded } });
    cache.clear(); state.reports = await loadReports();
    state.busy = false; msg(`${name} issued.`);
    await openReport(r.id);
  } catch (e) { state.busy = false; msg('Could not issue the report: ' + (e.message || e)); render(); }
}
// Copies a report's typed content (all saved sections except those listed) into another report
async function copyContent(fromId, toId, skip, forNewPeriod) {
  const src = editsFrom(await loadContent(fromId));
  // a new period: the look-ahead's weekly lists belong to the old period (constraints carry over)
  if (forNewPeriod) Object.keys(src).filter(k => typeOf(k) === 'lookahead').forEach(k => { src[k] = Object.assign({}, src[k], { w: [] }); });
  const store = await loadContent(toId);
  for (const k of Object.keys(src)) if (!(skip || []).includes(k)) await saveSection(store, k, CONFIG.kinds.edits, src[k], { reload: false });
}
// Create revision: a new draft of the same report number, with everything copied (images carry over from the original)
async function createRevision() {
  const r = curReport(), p = curProject();
  if (!r || !p || r.status !== CONFIG.statusLabels.issued || state.busy) return;
  const same = reportsFor(p.id).filter(x => x.no === r.no);
  const open = same.find(x => x.revision > r.revision && canEdit(x));
  if (open) { msg(`Report ${r.no} rev ${open.revision} is already being drafted.`); await openReport(open.id); return; }
  const rev = Math.max(...same.map(x => x.revision)) + 1;
  if (!await ask(`Create Report ${r.no} rev ${rev}?\n\nYou'll get an editable copy. The issued report stays as it is.`, 'Create revision', 'Cancel')) return;
  state.busy = true; msg('Creating the revision…'); render();
  try {
    const per = periodOf(r);
    const id = await createReport(p, r.no, per ? per.w1 : parseISO(r.week1), per ? per.weeks : CONFIG.period.defaultWeeks, rev);
    await copyContent(r.id, id, []);
    cache.clear(); state.reports = await loadReports();
    state.busy = false; msg(`Report ${r.no} rev ${rev} created as a draft.`);
    await openReport(id);
  } catch (e) { state.busy = false; msg('Could not create the revision: ' + (e.message || e)); render(); }
}

/* ================= Change the open report's period ================= */
async function changePeriod(n) {
  const r = curReport(), per = r && periodOf(r);
  if (!r || !per || n === per.weeks) { render(); return; }
  if (!await okToLeave()) { render(); return; }
  try {
    if (![CONFIG.statusLabels.draft, CONFIG.statusLabels.review].includes(r.status)) throw new Error('Issued reports keep their period.');
    const wc = await weeksCol();
    if (!wc) throw new Error(`Add a Numbers column titled "${CONFIG.period.weeksColumnTitle}" to the Client Report board, then use Refresh.`);
    const end = addDays(per.w1, 7 * n - 1);
    // the new period must not run into the project's next report
    const clash = state.reports.find(x => x.id !== r.id && x.projectId === r.projectId && parseISO(x.week1) && parseISO(x.week1) > per.w1 && parseISO(x.week1) <= end);
    if (clash) throw new Error(`A ${n}-week period would overlap Report ${clash.no}, which starts ${fDMY(parseISO(clash.week1))}.`);
    state.busy = true; msg('Changing the period…'); render();
    await gql('mutation ($b: ID!, $i: ID!, $v: JSON!) { change_multiple_column_values(board_id: $b, item_id: $i, column_values: $v) { id } }',
      { b: String(CONFIG.boards.reports), i: r.id, v: JSON.stringify({ [wc]: String(n), [CONFIG.report.statusDate]: { date: iso(addDays(per.w1, 7 * n - 3)) } }) });
    cache.clear();
    state.reports = await loadReports();
    state.busy = false;
    const np = periodOf(curReport() || r);
    msg(`Report ${r.no} now covers ${np ? periodText(np) : n + ' weeks'}.`);
    await openReport(r.id);
  } catch (e) { state.busy = false; msg('Could not change the period: ' + (e.message || e)); render(); }
}

/* ================= New report ================= */
function openNewPanel() {
  const list = reportsFor(state.project), last = list[0];
  const lastPer = last ? periodOf(last) : null;
  $('newNo').value = last ? last.no + 1 : 1;
  $('newWeeks').value = String(lastPer ? lastPer.weeks : CONFIG.period.defaultWeeks);
  $('newWeek1').dataset.auto = '1';
  $('newCopyWrap').hidden = !last;
  $('newCopy').checked = true;
  $('newCopyText').textContent = last ? `Start from Report ${last.no}${last.revision ? ' rev ' + last.revision : ''}'s content (commentary, tables, constraints and slide layout; not photos or the weekly look-ahead)` : '';
  newDefaults();
  $('newPanel').hidden = false;
}
// Week 1 follows on from the last report; for a first report, the period ending this week.
function newDefaults() {
  const last = reportsFor(state.project)[0], lastPer = last ? periodOf(last) : null;
  const n = clampWeeks(+$('newWeeks').value);
  if ($('newWeek1').dataset.auto === '1') $('newWeek1').value = iso(lastPer ? addDays(lastPer.end, 1) : addDays(mondayOf(new Date()), -7 * (n - 1)));
  const w1 = parseISO($('newWeek1').value);
  const per = w1 ? periodOf({ week1: iso(w1), weeks: n }) : null;
  $('newHint').textContent = (last ? `Last report: Report ${last.no}${lastPer ? ', ' + periodShort(lastPer) : ''}. ` : 'First report for this project. ')
    + (per ? `This report covers ${periodText(per)}; status date ${fDMY(per.status)}.` : '');
}
async function createFromPanel() {
  const p = curProject(), no = parseInt($('newNo').value, 10), w1 = parseISO($('newWeek1').value), n = clampWeeks(+$('newWeeks').value);
  if (!p) return;
  if (!(no > 0)) { msg('Enter a report number.'); return; }
  if (!w1 || w1.getDay() !== 1) { msg('Week 1 commencing must be a Monday.'); return; }
  if (!await okToLeave()) return;
  state.busy = true; $('newCreate').disabled = true; msg('Creating the draft…'); render();
  try {
    const id = await createReport(p, no, w1, n);
    const last = reportsFor(p.id)[0];
    if (last && $('newCopy').checked) { msg('Copying the last report\'s content…'); await copyContent(last.id, id, ['photoMeta'], true); }
    cache.clear();
    state.reports = await loadReports();
    if (!state.reports.some(r => r.id === id)) throw new Error('The report was created but could not be read back yet. Use Refresh in a moment.');
    $('newPanel').hidden = true; state.page = 0; msg(`Report ${no} created as a draft.`);
    state.busy = false; await openReport(id);
  } catch (e) { msg('Could not create the report: ' + (e.message || e)); state.busy = false; render(); }
  $('newCreate').disabled = false;
}

const PREFS_KEY = 'holden-client-report';
function savePrefs() {
  if (state.loading) return;   // nothing chosen yet: keep what was remembered
  try {
    const p = curProject(), r = curReport(), src = state.figs && state.figs.source;
    // boardId, locked and live let the next start-up begin reading the report straight away (see earlyStart)
    localStorage.setItem(PREFS_KEY, JSON.stringify({ project: state.project, report: state.report, page: state.page, mode: state.mode,
      boardId: p ? p.boardId : '', locked: isLocked(r), live: src ? src.mode === 'live' : null }));
  } catch (e) {}
}
// Start-up: the remembered report's content and figures start loading at once, alongside the lists of projects and
// reports, instead of after them. Everything read here is the same call the report makes anyway; if another report
// ends up open, these results are simply not used.
function earlyStart() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null');
    if (!p || !p.report) return;
    warm = { id: String(p.report), p: loadContent(p.report) }; warm.p.catch(() => {});
    if (p.locked) return;                       // issued: figures come from the frozen copy
    if (p.project) loadSnapshots(p.project).catch(() => {});
    if (p.live !== false) {                     // last time the figures were read live from POAP (or not known)
      if (p.boardId) loadPOAP(p.boardId).catch(() => {});
      loadSitePerformance().catch(() => {});
    }
  } catch (e) {}
}
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null');
    if (!p) return;
    if (state.projects.some(x => x.id === p.project)) state.project = p.project;
    if (state.reports.some(x => x.id === p.report && x.projectId === state.project)) state.report = p.report;
    if (Number.isInteger(p.page)) state.page = p.page;
    if (p.mode === 'all' || p.mode === 'slides') state.mode = p.mode;
  } catch (e) {}
}

async function loadAll() {
  const [projects, reports] = await Promise.all([loadProjects(), loadReports()]);
  state.projects = projects; state.reports = reports;
}
async function refresh() {
  if (!await okToLeave()) return;
  cache.clear(); poapCache.clear(); snapCache.clear(); snapKnown.clear(); forgetPoapGroups(); weeksColPromise = null; state.loading = true; state.error = ''; render();
  try { await loadAll(); } catch (e) { state.error = e.message || String(e); }
  state.loading = false;
  if (!state.reports.some(r => r.id === state.report)) state.report = (reportsFor(state.project)[0] || {}).id || '';
  await openReport(state.report);
}

$('stage').addEventListener('input', e => { const el = e.target; if (!el.dataset || !el.dataset.k) return; applyInput(el); renderSaveState(); });
$('stage').addEventListener('change', e => { const el = e.target; if (!el.dataset || !el.dataset.k) return; applyInput(el); setTimeout(render, 0); });
$('stage').addEventListener('click', e => {
  const up = e.target.closest('[data-upload]'); if (up && state.editing) { openUpload(up.dataset.upload); return; }
  const fl = e.target.closest('[data-fillla]'); if (fl && state.editing) { fillLookahead(fl.dataset.fillla); return; }
  const rm = e.target.closest('[data-remove]'); if (rm && state.editing) { removeFile(rm.dataset.remove); return; }
  const hp = e.target.closest('[data-hidephoto]');
  if (hp && state.editing) {
    const list = (E('photoMeta').removed || []).slice(); list.push(hp.dataset.hidephoto);
    setPath('photoMeta', ['removed'], list); render(); return;
  }
  const b = e.target.closest('[data-act]'); if (!b || !state.editing) return;
  const sid = b.dataset.sec, path = JSON.parse(b.dataset.k);
  ensureSection(sid);
  let arr = getPath(state.edits[sid], path);
  if (!Array.isArray(arr)) { setPath(sid, path, []); arr = getPath(state.edits[sid], path); }
  if (b.dataset.act === 'add') arr.push(JSON.parse(b.dataset.tpl));
  if (b.dataset.act === 'del') arr.splice(+b.dataset.i, 1);
  render();
});
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
$('fWeeks').addEventListener('change', e => changePeriod(clampWeeks(+e.target.value)));
$('newBtn').addEventListener('click', openNewPanel);
$('newCancel').addEventListener('click', () => { $('newPanel').hidden = true; msg(''); });
$('newCreate').addEventListener('click', createFromPanel);
$('newWeeks').addEventListener('change', newDefaults);
$('newWeek1').addEventListener('change', () => { $('newWeek1').dataset.auto = ''; newDefaults(); });
$('refresh').addEventListener('click', refresh);
$('modeSlides').addEventListener('click', () => { state.mode = 'slides'; render(); });
$('modeAll').addEventListener('click', () => { state.mode = 'all'; render(); });
$('prev').addEventListener('click', () => { state.page--; render(); });
$('next').addEventListener('click', () => { state.page++; render(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { state.page = +b.dataset.i; render(); } });
document.addEventListener('keydown', e => {
  if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey || state.mode !== 'slides') return;
  const ctx = context(); if (!ctx) return;
  if (e.key === 'ArrowLeft' && state.page > 0) { state.page--; render(); }
  if (e.key === 'ArrowRight' && state.page < ctx.slides.length - 1) { state.page++; render(); }
});
window.addEventListener('resize', fitSlides);

// For checks in the browser console
window.ClientReport = { selfTest, imageTest, filesCheck, loadContent, saveSection, loadFigures, state, timings };

/* ================= Start ================= */
function pickDefaults() {
  loadPrefs();
  if (!state.project) state.project = (state.projects.find(p => reportsFor(p.id).length) || state.projects[0] || {}).id || '';
  if (!state.report) state.report = (reportsFor(state.project)[0] || {}).id || '';
}
// After starting from the saved lists: read the live lists, and take them in. If the open report or its project changed
// (e.g. issued, period changed, or removed elsewhere), the report opens again, unless it has unsaved changes.
async function liveLists(opening) {
  const t0 = performance.now();
  let projects, reports;
  try { [projects, reports] = await Promise.all([loadProjects(), loadReports()]); }
  catch (e) { console.warn(LOG, 'The live lists of projects and reports could not be read; showing the saved ones', e); return; }
  await opening;
  const sig = () => JSON.stringify([curProject() || null, curReport() || null]);
  const before = sig();
  state.projects = projects; state.reports = reports;
  if (!state.projects.some(p => p.id === state.project)) state.project = '';
  if (!state.reports.some(r => r.id === state.report && r.projectId === state.project)) state.report = '';
  pickDefaults();
  console.info(`${LOG} Live lists read in the background, ${Math.round(performance.now() - t0)} ms`);
  if (sig() !== before && !isDirty() && !state.editing) { console.info(LOG, 'The open report changed since last time: opening it again'); await openReport(state.report); }
  else render();
}

(async function init() {
  // start the remembered report and the boards every report needs, so they load while the projects and reports are read
  earlyStart();
  render();
  [loadProgressHistory].forEach(fn => { fn().catch(() => {}); });
  // lists saved last time: show them at once, and read the live ones in the background
  const saved = savedLists();
  if (saved) {
    state.projects = saved.projects; state.reports = saved.reports;
    T_LISTS = Math.round(performance.now());
    pickDefaults();
    state.loading = false;
    console.info(`${LOG} Saved lists from ${new Date(saved.at).toLocaleString('en-IE')} shown`);
    const opening = openReport(state.report);
    liveLists(opening);
    return;
  }
  try {
    await loadAll();
    T_LISTS = Math.round(performance.now());
    pickDefaults();
  } catch (e) { state.error = e.message || String(e); }
  state.loading = false;
  await openReport(state.report);
})();
</script>
