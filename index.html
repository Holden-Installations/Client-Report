<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<!-- Same monday-sdk-js version as the leadership report -->
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.5/dist/main.js"></script>
<style>
/* ---- Slide styles: copied from the signed-off mockup ---- */
body{margin:0}
.wrap{overflow-x:auto;max-width:100%}
.slide{position:relative;width:1280px;height:720px;background:#fff;margin:0 auto;overflow:hidden;font-family:Lato,'Segoe UI',Arial,sans-serif;color:#2D2D2D;border:1px solid #DCE2E7;box-sizing:border-box}
.hdr{position:absolute;left:48px;right:48px;top:24px;display:flex;align-items:center;gap:16px;border-bottom:3px solid #44C8E8;padding-bottom:12px}
.mono{width:30px;height:38px;flex:none}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6472}
.ttl{margin:3px 0 0;font-size:28px;font-weight:900;color:#2D2D2D;line-height:1.1}
.body{position:absolute;left:48px;right:48px;top:118px;bottom:62px}
.ftr{position:absolute;left:48px;right:48px;bottom:16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #E6E9ED;padding-top:8px;font-size:11.5px;color:#5B6472}
.wmk{height:17px;display:block}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:30px}
.col{display:flex;flex-direction:column;gap:18px;min-height:0}
.two>*{min-height:0}
.card{background:#F7F8FA;border:1px solid #E6E9ED;border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;box-sizing:border-box}
.ch{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0B6A82}
.bl{margin:0;padding-left:18px;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:7px}
.bl li::marker{color:#0B6A82}
.gt{font-size:16px;font-weight:700;margin:0 0 6px}
.mt{display:grid;border:1px solid #E6E9EF;border-left-width:6px;border-radius:5px;overflow:hidden;font-size:14px;background:#fff}
.mh{padding:8px 10px;font-size:12.5px;color:#676879;border-bottom:1px solid #E6E9EF;border-left:1px solid #E6E9EF;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.mc{padding:8px 10px;border-bottom:1px solid #E6E9EF;border-left:1px solid #E6E9EF;display:flex;align-items:center;justify-content:center;text-align:center}
.mi{justify-content:flex-start;text-align:left;border-left:0}
.pb{position:relative;height:8px;flex:1;background:#E6E9ED;border-radius:4px;min-width:40px}
.pf{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#0B6A82}
.pt{position:absolute;top:-4px;width:2px;height:16px;background:#2D2D2D}
.pc{font-size:12.5px;color:#5B6472;min-width:36px;text-align:right}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:4px;white-space:nowrap}
.tl{border:1px solid #DCE2E7;border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;background:#fff}
.tv{font-size:30px;font-weight:900;line-height:1.05}
.ts{font-size:12.5px;color:#5B6472}
.ph{border:2px dashed #9AA7B1;background:#F2F4F6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#3B4A56;box-sizing:border-box;padding:16px;border-radius:6px}
.ta{width:100%;box-sizing:border-box;border:2px dashed #C77700;background:#FFFBF2;border-radius:4px;padding:8px 10px;font-family:inherit;font-size:14px;line-height:1.4;color:#2D2D2D;resize:vertical;flex:1;min-height:60px}
.ce{width:100%;box-sizing:border-box;height:22px;border:2px dashed #C77700;background:#FFFBF2;border-radius:3px;font-family:inherit;font-size:13px;color:#2D2D2D;padding:0 4px;min-width:0;text-align:inherit}
.cv{border:2px dashed #C77700;background:#FFFBF2;font-family:inherit;font-weight:700;color:#2D2D2D;border-radius:4px;padding:0 8px;height:22px;font-size:13px;box-sizing:border-box;min-width:0}
.upl{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:4px;background:#fff;border:1px solid #0B6A82;color:#0B6A82;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);font-family:inherit}
.addrow{margin-left:auto;height:24px;padding:0 10px;border-radius:4px;border:1px dashed #0B6A82;background:#fff;color:#0B6A82;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.xb{flex:none;width:20px;height:20px;margin-left:4px;border:1px solid #C9D2D9;border-radius:3px;background:#fff;color:#8E1B12;font-weight:700;cursor:pointer;padding:0;line-height:1}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#3B4452}
.ctl select{height:40px;min-width:170px;border:1px solid #B8C2CC;border-radius:4px;padding:0 10px;font:inherit;font-size:14px;font-weight:400;background:#fff;color:#2D2D2D}
.btn{height:40px;padding:0 16px;border-radius:4px;border:1px solid #0B6A82;background:#0B6A82;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn2{height:40px;padding:0 14px;border-radius:4px;border:1px solid #0B6A82;background:#fff;color:#0B6A82;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn2:disabled{opacity:.4;cursor:default}
.seg{height:36px;padding:0 14px;border:1px solid #B8C2CC;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.arw{width:44px;height:44px;border-radius:50%;border:1px solid #0B6A82;background:#fff;color:#0B6A82;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.arw:disabled{opacity:.35;cursor:default}
.tab{height:36px;padding:0 12px;border-radius:18px;border:1px solid #DCE2E7;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chipb{display:flex;align-items:center;border:1px solid #B8C2CC;border-radius:6px;background:#fff;overflow:hidden}
.chipb button{font:inherit;border:0;background:transparent;cursor:pointer;height:34px;color:#2D2D2D}
.chipb .nm{padding:0 10px;font-size:13px;font-weight:700}
.chipb .mi2{width:28px;font-size:16px;color:#0B6A82;border-left:1px solid #E1E5E9}
.chipb .mi2:disabled{opacity:.3;cursor:default}
.chipb .hd{padding:0 8px;font-size:12px;font-weight:700;color:#0B6A82;border-left:1px solid #E1E5E9}
/* ---- App frame ---- */
:root { --ink: #2D2D2D; --muted: #5B6472; --line: #DCE2E7; --soft: #EEF2F5; --cyan: #44C8E8; --teal: #0B6A82; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--soft); font-family: Lato, 'Segoe UI', Arial, sans-serif; color: var(--ink); }
.app { max-width: 1320px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.bar h1 { margin: 0 4px 8px 0; font-size: 20px; font-weight: 900; }
.bar .tag { margin-bottom: 9px; }
.ctl select, .ctl input { height: 40px; min-width: 170px; border: 1px solid #B8C2CC; border-radius: 4px; padding: 0 10px; font: inherit; font-size: 14px; font-weight: 400; background: #fff; color: var(--ink); }
#fReport { min-width: 320px; }
.btn:disabled { opacity: .5; cursor: default; }
.segs { display: flex; margin-left: auto; }
.seg[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
.seg[aria-pressed="false"] { background: #fff; color: var(--ink); }
.small { font-size: 12.5px; color: var(--muted); }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.panel .small { flex-basis: 100%; }
nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.where { min-width: 170px; text-align: center; }
.where b { display: block; font-size: 15px; }
.where span { font-size: 12.5px; color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tab { background: #fff; color: var(--teal); }
.tab[aria-current="page"] { background: var(--teal); color: #fff; border-color: var(--teal); }
.note { padding: 14px 16px; border: 1px dashed #B8C2CC; border-radius: 6px; color: var(--muted); font-size: 14px; background: #fff; }
.err { padding: 14px 16px; border: 1px solid #F1B5AE; background: #FBE1DE; color: #8E1B12; border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
#stage { display: flex; flex-direction: column; gap: 18px; }
.fit { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; overflow: hidden; }
.fit-in { width: 1280px; height: 720px; transform-origin: 0 0; }
.wmt { font-weight: 900; letter-spacing: .14em; color: #3B5163; }
.empty-hint { font-size: 13px; color: #8A97A4; }
.pv-hit { position: absolute; top: 0; bottom: 0; z-index: 3; cursor: default; }
.pv-hit:hover { background: rgba(0, 115, 234, .06); }
.pv-tip { display: none; position: absolute; top: 34px; background: #2D2D2D; color: #fff; font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 6px; white-space: nowrap; z-index: 5; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
.pv-hit:hover .pv-tip { display: block; }
.src-note { font-size: 11.5px; color: #1F4E79; background: #E1ECF7; border-radius: 4px; padding: 4px 8px; margin-top: 8px; display: inline-block; }
#exportArea { position: fixed; left: -20000px; top: 0; width: 1280px; }
#exportArea .slide { border: 0; margin: 0 0 20px; }
#exportArea .empty-hint, #exportArea .src-note, #exportArea .pv-tip { display: none !important; }
.slide-tags { max-width: 1280px; width: 100%; margin: 0 auto 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.is-hidden .fit-in { opacity: .45; }
.dlg { position: fixed; inset: 0; background: rgba(20, 30, 40, .35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.dlg-box { background: #fff; border-radius: 8px; padding: 20px 22px; max-width: 460px; width: 100%; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.ta, .ce, .cv { font-family: inherit; }
#saveState.dirty { color: #7A3405; font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Client report</h1>
    <span class="tag" id="statusTag" hidden></span>
    <label class="ctl">Project <select id="fProject"></select></label>
    <label class="ctl">Report <select id="fReport"></select></label>
    <label class="ctl">Period <select id="fWeeks" style="min-width: 150px"><option value="1">1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option></select></label>
    <button class="btn2" id="newBtn" type="button">New report</button>
    <button class="btn2" id="refresh" type="button" title="Reload the latest data from monday">Refresh</button>
    <button class="btn2" id="editBtn" type="button">Edit report</button>
    <button class="btn" id="saveBtn" type="button" hidden>Save draft</button>
    <button class="btn" id="pdfBtn" type="button">Download PDF</button>
    <button class="btn" id="pptBtn" type="button">Download PowerPoint</button>
    <button class="btn" id="issueBtn" type="button" hidden>Issue report</button>
    <button class="btn2" id="revBtn" type="button" hidden>Create revision</button>
    <span class="small" id="saveState" style="margin-bottom: 12px"></span>
    <div class="segs" role="group" aria-label="Page layout">
      <button type="button" class="seg" id="modeSlides" aria-pressed="true" style="border-radius: 4px 0 0 4px">One page at a time</button>
      <button type="button" class="seg" id="modeAll" aria-pressed="false" style="border-radius: 0 4px 4px 0; border-left: 0">All pages</button>
    </div>
  </div>
  <div class="small" id="msg" role="status"></div>

  <div class="panel" id="newPanel" hidden>
    <label class="ctl">Report no. <input id="newNo" type="number" min="1" step="1"></label>
    <label class="ctl">Period <select id="newWeeks"><option value="1">1 week (weekly)</option><option value="2">2 weeks (biweekly)</option><option value="3">3 weeks</option><option value="4">4 weeks</option></select></label>
    <label class="ctl">Week 1 commencing (Monday) <input id="newWeek1" type="date"></label>
    <button class="btn" id="newCreate" type="button">Create draft</button>
    <button class="btn2" id="newCancel" type="button">Cancel</button>
    <label class="small" id="newCopyWrap" style="flex-basis: 100%; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink)"><input type="checkbox" id="newCopy" checked> <span id="newCopyText"></span></label>
    <div class="small" id="newHint"></div>
  </div>

  <div class="panel" id="slidePanel" hidden style="flex-direction: column; align-items: stretch; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <div style="font-size: 15px; font-weight: 700">Slides in this report</div>
      <div class="small">Click a slide to open it. Use the arrows to reorder, Hide to leave it out of the report, Duplicate to copy it, Remove to delete a copy.</div>
      <button class="btn2" type="button" id="addPhotos" style="margin-left: auto; height: 36px">Add progress photos slide</button>
    </div>
    <div id="chips" style="display: flex; gap: 8px; flex-wrap: wrap"></div>
  </div>

  <nav aria-label="Report pages" id="nav">
    <button class="arw" id="prev" type="button" aria-label="Previous page">‹</button>
    <div class="where"><b id="pageName"></b><span id="pageNo"></span></div>
    <button class="arw" id="next" type="button" aria-label="Next page">›</button>
    <div class="tabs" id="tabs"></div>
  </nav>

  <div id="stage" aria-live="polite"></div>
</div>

<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgText">
  <div class="dlg-box"><div id="dlgText" style="font-size: 15px; line-height: 1.45; white-space: pre-line"></div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px"><button class="btn2" type="button" id="dlgNo">Cancel</button><button class="btn" type="button" id="dlgYes">OK</button></div></div>
</div>

<script>
/* =========================================================
   CONFIG: the only place board IDs, column IDs and settings live.
   The report never depends on the board it is hosted on.
   ========================================================= */
const CONFIG = {
  boards: {
    portfolio: 5100469221,     // Portfolio | Projects
    reports: 5107777871,       // Client Report: one item per project per report
    reportParts: 5107778630,   // Subitems of Client Report: saved content, split into parts
    snapshots: 5107802036,         // Client Report Snapshots: weekly copy of each project's POAP table (n8n, Sundays)
    sitePerformance: 5106971717,   // Site Performance: H&S, one row per project per month
    progressHistory: 5106398376    // Programme Progress history: one row per project board per week
  },
  portfolio: {
    client: 'board_relation_mm5a20pg',     // Client (connected board)
    projectBoardId: 'text_mm7ghd9',        // Project Board ID
    pm: 'multiple_person_mm5ab64y',        // Project Manager: default "Prepared by" on a new report
    programmeTimeline: 'timerange_mm91j0ar',   // MS Project start and finish, written by n8n
    hsTargets: { gcc: 'numeric_mm7haytr', tbt: 'numeric_mm7h73j8', aud: 'numeric_mm7hgn88' }
  },
  // The POAP table on each project board is the single source of truth for Design, Commercial, Quality and H&S.
  // The weekly snapshot copies it every Sunday; the app reads the snapshot for the report's status week,
  // and reads POAP live only when that week has no snapshot yet.
  poap: { total: 'numeric_mm83y3cg', planned: 'numeric_mm7rwtjg', actual: 'numeric_mm7rx2gw' },
  snapshot: { projectId: 'project_id', weekEnding: 'week_ending', metric: 'metric', total: 'total', planned: 'planned_to_date', toDate: 'to_date' },
  // Each figure: [snapshot metric, POAP group, POAP row, slide section, key, label on the slide]
  metrics: [
    ['Drawings', 'Design', 'Drawings', 'design', 'drawings', 'Drawings'],
    ['Techsubs', 'Design', 'Techsubs', 'design', 'techsubs', 'Techsubs'],
    ['Design Call-offs', 'Design', 'Call-Offs', 'design', 'call-offs', 'Call-offs'],
    ['RFQ', 'Commercial', 'RFQ', 'commercial', 'rfq', 'RFQs'],
    ['Suppliers Selected', 'Commercial', 'Suppliers Selected', 'commercial', 'suppliers selected', 'Suppliers selected'],
    ['Commercial Call-offs', 'Commercial', 'Call-Offs', 'commercial', 'call-offs', 'Call-offs'],
    ['Benchmarks', 'Quality', 'Benchmarks', 'quality', 'benchmark', 'Benchmarks (FOAKs)'],
    ['Checksheets', 'Quality', 'Checksheets', 'quality', 'checksheet', 'Checksheets'],
    ['Handover', 'Quality', 'Handover', 'quality', 'handover', 'Handover'],
    ['GCC', 'H&S', 'GCC', 'hs', 'gcc'], ['TBT', 'H&S', 'TBT', 'hs', 'tbt'], ['Audits', 'H&S', 'Audits', 'hs', 'aud'],
    // not in POAP: the snapshot copies these from Site Performance (all months)
    ['Incidents', null, null, 'hs', 'inc'], ['LTI', null, null, 'hs', 'lti'], ['Near Misses', null, null, 'hs', 'nm'],
    ['Non-compliances', null, null, 'hs', 'nc'], ['Hours Worked', null, null, 'hs', 'hours']
  ],
  sitePerformance: {
    project: 'board_relation_mm8m8fh7', projectName: 'dropdown_mm8mmeh0', month: 'date_mm8mgh19',
    hours: 'numeric_mm8mfp3', gcc: 'numeric_mm8m5r81', tbt: 'numeric_mm8mtstn', aud: 'numeric_mm8mtt3t',
    inc: 'numeric_mm8mdc1g', lti: 'numeric_mm8md4dc', nm: 'numeric_mm8m42dn', nc: 'numeric_mm8ms02h'
  },
  progressHistory: {
    projectBoardId: 'text_mm8a8vpx', weekEnding: 'date_mm8av3kd',
    planned: 'numeric_mm8aya41', actual: 'numeric_mm8av2aw', worstDelay: 'numeric_mm8a4dkt',
    tasksBehind: 'numeric_mm8as8my', tasksTracked: 'numeric_mm8av68a',
    topDelays: 'long_text_mm911tf3',   // JSON list of the week's tasks furthest behind
    packages: 'text_mm95fdca',         // JSON list of each package's planned %, actual %, days late and status (Site installation)
    plannedAheadTitle: 'Planned ahead', // optional Text column (found by title): planned % at the next Fridays, for the chart
    chartWeeks: 10,                    // weeks shown on the planned vs actual chart, up to the status date
    attentionCount: 3                  // tasks shown in "Needs attention"
  },
  // Quality boards: each item has a Project link, a Due Date and a Status
  quality: {
    benchmark:  { board: 5106892134, project: 'board_relation_mm8k8g4m', due: 'date_mm8mt3z1', status: 'color_mm8ky1sa', label: 'Benchmarks (FOAKs)' },
    checksheet: { board: 5106894810, project: 'board_relation_mm8krc9t', due: 'date_mm8kr3tz', status: 'color_mm8k28jr', label: 'Checksheets' },
    handover:   { board: 5106941328, project: 'board_relation_mm8tc9g7', due: 'date4',         status: 'status',         label: 'Handover' },
    doneLabels: ['complete', 'completed', 'done', 'approved', 'signed off']   // same as the leadership report
  },
  report: {
    project: 'board_relation_mm92saqz', projectId: 'text_mm92cwcr',
    no: 'numeric_mm92xg31', revision: 'numeric_mm92dt36',
    week1: 'date_mm92e3cq', statusDate: 'date_mm92sb7c', presentedOn: 'date_mm92zwxr',
    preparedBy: 'multiple_person_mm92h5az', status: 'color_mm928f4v',
    issuedOn: 'date_mm9247az', issuedBy: 'multiple_person_mm92z03a',
    files: {   // used from Phase 3
      cover: 'file_mm92bnzs', markup: 'file_mm92f91k', keyPlan: 'file_mm92yz4p',
      lookahead: 'file_mm92gm2j', photos: 'file_mm92embf', issuedPdf: 'file_mm9294y7'
    }
  },
  parts: { section: 'text_mm92y44k', kind: 'dropdown_mm92acnb', part: 'numeric_mm92z333', content: 'long_text_mm92mzrj' },
  statusLabels: { draft: 'Draft', review: 'In Review', issued: 'Issued', superseded: 'Superseded' },
  kinds: { edits: 'Edits', issued: 'Issued data' },
  // Long text holds up to 2,000 characters; parts are kept a little under that.
  chunkChars: 1800,
  // Period: counted from Week 1 Commencing (a Monday), N weeks long. Status date = Friday of the last week; footer date = its Sunday.
  period: { defaultWeeks: 2, maxWeeks: 4, weeksColumnTitle: 'Period (weeks)' },   // the Period (weeks) column is found by its title
  excludeNameContains: [],     // e.g. ['test'] to hide test projects before go-live
  siteMaxPackages: 5,          // packages shown on Site installation; the rest go in a "+ N more packages" line
  // PDF export: same libraries as the leadership report. Pages are 16:9, like the slides (13.33 × 7.5 in).
  pdf: { libs: {
    html2canvas: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js' }, scale: 2, quality: 0.92 },
  // PowerPoint export: PptxGenJS (includes JSZip), from jsDelivr like the monday SDK
  pptx: { lib: 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js', font: 'Lato' }

  let res;
  try { res = await monday.api(query, { variables, apiVersion: apiVersion || API_VERSION }); }
  catch (e) {
    // the SDK rejects on errors and keeps monday's reply on the error: unwrap it so the real reason is shown
    const d = e && e.data;
    res = d && d.errors ? d : Array.isArray(d) ? { errors: d } : { errors: [{ message: (e && e.message) || String(e), extensions: d ? { reply: d } : undefined }] };
  }
  if (res.errors && res.errors.length) {
    const detail = res.errors.map(e => [e.message, e.extensions && JSON.stringify(e.extensions).slice(0, 400),
      e.locations ? 'at ' + JSON.stringify(e.locations) : ''].filter(Boolean).join(' | ')).join('; ');
    console.error(LOG, 'monday error', { errors: res.errors, query, variables });
    throw new Error('monday API error: ' + detail);
  }
  if (res.error_message) throw new Error('monday API error: ' + res.error_message);
  return res.data;
}

// Only the requested columns; value is included for people and date columns.
const ITEM_FIELDS = `id name column_values(ids: $cols) { id text value
  ... on BoardRelationValue { display_value linked_item_ids } ... on MirrorValue { display_value } }`;

// Every item on a board (with paging), cached until Refresh.
// cols = null: every column, plus the board's column list (id, title, type) in the same call, so a column found by its
// title needs no extra round trip before the board is read.
function fetchBoard(boardId, cols, calc) {
  const all = !cols;
  const key = String(boardId) + '|' + (all ? '*' : cols.join(',')) + (calc ? '|calc' : '');
  const FIELDS = all ? ITEM_FIELDS.replace('column_values(ids: $cols)', 'column_values') : calc ? ITEM_FIELDS.replace('column_values(ids: $cols)', 'column_values(ids: $cols, capabilities: [CALCULATED])') : ITEM_FIELDS;
  const VARS = all ? '$ids: [ID!]' : '$ids: [ID!], $cols: [String!]', NEXT_VARS = all ? '$c: String!' : '$c: String!, $cols: [String!]';
  const BOARDS = calc ? 'boards(ids: $ids, hierarchy_types: [classic, multi_level])' : 'boards(ids: $ids)';
  if (cache.has(key)) return cache.get(key);
  const p = (async () => {
    const t0 = performance.now();
    const first = await gql(`query (${VARS}) { ${BOARDS} { id name ${all ? 'columns { id title type }' : ''}
      items_page(limit: 500) { cursor items { ${FIELDS} } } } }`, all ? { ids: [String(boardId)] } : { ids: [String(boardId)], cols });
    const b = first.boards && first.boards[0];
    if (!b) throw new Error(`Board ${boardId} was not found, or you don't have access to it.`);
    let items = b.items_page.items, cursor = b.items_page.cursor;
    while (cursor) {
      const nx = await gql(`query (${NEXT_VARS}) { next_items_page(limit: 500, cursor: $c) { cursor items { ${FIELDS} } } }`, all ? { c: cursor } : { c: cursor, cols });
      items = items.concat(nx.next_items_page.items);
      cursor = nx.next_items_page.cursor;
    }
    console.info(`${LOG} ${b.name}: ${items.length} items, ${Math.round(performance.now() - t0)} ms`);
    return { id: b.id, name: b.name, items, columns: b.columns || null };
  })();
  p.catch(() => cache.delete(key));
  cache.set(key, p);
  return p;
}
const cv = (item, id) => (item.column_values || []).find(x => x.id === id) || null;
const val = (item, id) => { const c = cv(item, id); return c ? String(c.text || c.display_value || '').trim() : ''; };
const links = (item, id) => { const c = cv(item, id); return c && c.linked_item_ids ? c.linked_item_ids.map(String) : []; };
const json = (item, id) => { const c = cv(item, id); try { return c && c.value ? JSON.parse(c.value) : null; } catch (e) { return null; } };
const num = (s) => { const n = parseFloat(String(s || '').replace(/,/g, '')); return isNaN(n) ? 0 : n; };
// Long text: the value's text is exact; fall back to the display text
const longText = (item, id) => { const j = json(item, id); return j && typeof j.text === 'string' ? j.text : val(item, id); };

// item id -> linked item ids for one connected column (reading names here is the slow part)
async function readLinks(boardId, colIdLink) {
  const out = {};
  const F = `cursor items { id column_values(ids: ["${colIdLink}"]) { id ... on BoardRelationValue { linked_item_ids } } }`;
  let d = await gql(`query ($b: [ID!]) { boards(ids: $b) { items_page(limit: 500) { ${F} } } }`, { b: [String(boardId)] });
  let page = d.boards[0].items_page;
  for (;;) {
    page.items.forEach(it => { const c = (it.column_values || [])[0]; out[it.id] = c && c.linked_item_ids ? c.linked_item_ids.map(String) : []; });
    if (!page.cursor) break;
    d = await gql(`query ($c: String!) { next_items_page(limit: 500, cursor: $c) { ${F} } }`, { c: page.cursor });
    page = d.next_items_page;
  }
  return out;
}
// item id -> name, 100 ids per call
async function itemNames(ids) {
  const out = {};
  for (let i = 0; i < ids.length; i += 100) {
    const d = await gql('query ($i: [ID!]) { items(ids: $i) { id name } }', { i: ids.slice(i, i + 100) });
    (d.items || []).forEach(it => { out[String(it.id)] = it.name; });
  }
  return out;
}

/* ================= Dates ================= */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const parseISO = s => { const m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fDM = d => d.getDate() + ' ' + MON[d.getMonth()];
const fDMY = d => fDM(d) + ' ' + d.getFullYear();
const fDay = d => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ' ' + fDM(d);
const ordinal = n => { const v = n % 100; return n + (v >= 11 && v <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th')); };
const fLong = d => ordinal(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));

const CADENCE = { 1: 'Weekly', 2: 'Biweekly', 3: 'Three-weekly', 4: 'Four-weekly' };
const cadenceName = n => CADENCE[n] || `${n}-weekly`;
const lastWeeks = n => n === 1 ? 'last week' : `last ${n} weeks`;
const nextWeeks = n => n === 1 ? 'Next week' : `Next ${n} weeks`;
const periodHead = n => n === 1 ? 'Last week' : `Last ${n} weeks`;   // column header for the period (the mockup's "PTD")
const clampWeeks = n => Math.min(CONFIG.period.maxWeeks, Math.max(1, Math.round(n) || CONFIG.period.defaultWeeks));

function periodOf(r) {
  const w1 = parseISO(r.week1);
  if (!w1) return null;
  const n = clampWeeks(r.weeks);
  const starts = Array.from({ length: n }, (_, k) => addDays(w1, 7 * k));
  return { w1, weeks: n, starts, status: parseISO(r.statusDate) || addDays(w1, 7 * n - 3), end: addDays(w1, 7 * n - 1),
    next: Array.from({ length: n }, (_, k) => addDays(w1, 7 * (n + k))) };
}
const joinAnd = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
// "w/c 19 Oct and w/c 26 Oct 2026" (year on the last date; on every date if the period crosses a year end)
function periodText(per) {
  const sameYear = per.starts[0].getFullYear() === per.starts[per.starts.length - 1].getFullYear();
  return joinAnd(per.starts.map((d, i) => 'w/c ' + (!sameYear || i === per.starts.length - 1 ? fDMY(d) : fDM(d))));
}
// "w/c 19 Oct and 26 Oct", for lists
const periodShort = per => 'w/c ' + joinAnd(per.starts.map(fDM));

// The lists of projects and reports are kept in this browser, so the app can show them straight away on the next start
// while the live lists are read in the background (see init).
const LISTS_KEY = 'holden-client-report-lists';
function rememberList(part, list) {
  try { const j = JSON.parse(localStorage.getItem(LISTS_KEY) || '{}'); j[part] = list; j.at = Date.now(); localStorage.setItem(LISTS_KEY, JSON.stringify(j)); }
  catch (e) { try { localStorage.removeItem(LISTS_KEY); } catch (e2) {} }
}
function savedLists() {
  try {
    const j = JSON.parse(localStorage.getItem(LISTS_KEY) || 'null');
    if (!j || !Array.isArray(j.projects) || !Array.isArray(j.reports)) return null;
    // timeline dates were stored as text: turn them back into dates
    j.projects.forEach(p => { if (p.timeline) p.timeline = { start: new Date(p.timeline.start), end: new Date(p.timeline.end) }; });
    return j;
  } catch (e) { return null; }
}
async function loadProjects() {
  const list = await readProjects();
  rememberList('projects', list);
  return list;
}
async function readProjects() {
  const PC = CONFIG.portfolio;
  const ex = CONFIG.excludeNameContains.map(w => w.toLowerCase());
  const T = PC.hsTargets;
  const t0 = performance.now(); let tLinks = 0;
  const [b, clientLinks] = await Promise.all([fetchBoard(CONFIG.boards.portfolio, [PC.projectBoardId, PC.pm, PC.programmeTimeline, T.gcc, T.tbt, T.aud], true),
    readLinks(CONFIG.boards.portfolio, PC.client).then(x => { tLinks = Math.round(performance.now() - t0); return x; })]);
  const t1 = performance.now();
  const names = await itemNames([...new Set(Object.values(clientLinks).flat())]);
  console.info(`${LOG} Client links: ${tLinks} ms, client names: ${Math.round(performance.now() - t1)} ms`);
  return b.items.filter(it => !ex.some(w => it.name.toLowerCase().includes(w))).map(it => {
    const pm = json(it, PC.pm);
    return {
      id: String(it.id), name: it.name, code: it.name.split('|').pop().trim(),
      client: (clientLinks[it.id] || []).map(id => names[id]).filter(Boolean).join(', '),
      boardId: val(it, PC.projectBoardId),
      pmNames: val(it, PC.pm),
      pmIds: ((pm && pm.personsAndTeams) || []).filter(p => p.kind === 'person').map(p => p.id),
      timeline: parseTimeline(val(it, PC.programmeTimeline)),
      hsTarget: { gcc: num(val(it, T.gcc)), tbt: num(val(it, T.tbt)), aud: num(val(it, T.aud)) }
    };
  }).sort((a, b) => a.name.localeCompare(b.name));
}

// The Period (weeks) column, found by its title: "Period (weeks)" first, else any Numbers or Text column whose title
// mentions "period" or "weeks". Remembered once found; if not found, looked for again next time (e.g. just added).
let weeksColPromise = null, weeksColLogged = '';
function pickWeeksCol(columns) {
  const cols = (columns || []).filter(x => x.type === 'numbers' || x.type === 'text');
  const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const c = cols.find(x => norm(x.title) === norm(CONFIG.period.weeksColumnTitle)) || cols.find(x => /period|weeks/.test(norm(x.title)));
  if (c) { if (weeksColLogged !== c.id) { weeksColLogged = c.id; console.info(LOG, `Period column: "${c.title}" (${c.id}, ${c.type})`); } }
  else console.warn(LOG, `No "${CONFIG.period.weeksColumnTitle}" column on the Client Report board. Columns seen:`, cols.map(x => `${x.title} (${x.type})`));
  return c ? c.id : null;
}
function weeksCol() {
  if (weeksColPromise) return weeksColPromise;
  const p = gql('query ($b: [ID!]) { boards(ids: $b) { columns { id title type } } }', { b: [String(CONFIG.boards.reports)] }).then(d => {
    const id = pickWeeksCol(((d.boards || [])[0] || {}).columns);
    if (!id) weeksColPromise = null;
    return id;
  }).catch(e => { weeksColPromise = null; throw e; });
  weeksColPromise = p;
  return p;
}
async function loadReports() {
  const list = await readReports();
  rememberList('reports', list);
  return list;
}
async function readReports() {
  const R = CONFIG.report;
  // one call: the reports with all their columns, and the column list the Period (weeks) column is picked from
  const b = await fetchBoard(CONFIG.boards.reports, null);
  const wc = pickWeeksCol(b.columns);
  weeksColPromise = wc ? Promise.resolve(wc) : null;
  return b.items.map(it => ({
    id: String(it.id), name: it.name,
    projectId: val(it, R.projectId) || links(it, R.project)[0] || '',
    no: num(val(it, R.no)), revision: num(val(it, R.revision)),
    weeks: clampWeeks(wc ? num(val(it, wc)) : CONFIG.period.defaultWeeks),
    week1: val(it, R.week1), statusDate: val(it, R.statusDate), presentedOn: val(it, R.presentedOn),
    preparedBy: val(it, R.preparedBy), status: val(it, R.status) || CONFIG.statusLabels.draft, issuedOn: val(it, R.issuedOn)
  })).filter(r => r.projectId);
}
const reportsFor = pid => state.reports.filter(r => r.projectId === pid).sort((a, b) => b.no - a.no || b.revision - a.revision);

async function createReport(project, no, week1, weeks, revision) {
  const R = CONFIG.report, wc = await weeksCol();
  revision = revision || 0;
  if (reportsFor(project.id).some(r => r.no === no && r.revision === revision)) throw new Error(`Report ${no}${revision ? ' rev ' + revision : ''} already exists for ${project.code}.`);
  const vals = {
    [R.project]: { item_ids: [Number(project.id)] }, [R.projectId]: project.id,
    [R.no]: String(no), [R.revision]: String(revision),
    [R.week1]: { date: iso(week1) }, [R.statusDate]: { date: iso(addDays(week1, 7 * weeks - 3)) },
    [R.status]: { label: CONFIG.statusLabels.draft }
  };
  if (wc) vals[wc] = String(weeks);
  else if (weeks !== CONFIG.period.defaultWeeks) throw new Error(`To create a ${weeks}-week report, add a Numbers column titled "${CONFIG.period.weeksColumnTitle}" to the Client Report board, then use Refresh.`);
  if (project.pmIds.length) vals[R.preparedBy] = { personsAndTeams: project.pmIds.map(id => ({ id: Number(id), kind: 'person' })) };
  const d = await gql(`mutation ($b: ID!, $n: String!, $v: JSON!) { create_item(board_id: $b, item_name: $n, column_values: $v) { id } }`,
    { b: String(CONFIG.boards.reports), n: `${project.name} · Report ${no}${revision ? ' rev ' + revision : ''}`, v: JSON.stringify(vals) });
  return String(d.create_item.id);
}

/* ================= Report figures (Phase 1) ================= */
// Timeline text looks like "2026-01-05 - 2027-05-30"
function parseTimeline(t) {
  const m = String(t || '').match(/(\d{4}-\d{2}-\d{2}).*?(\d{4}-\d{2}-\d{2})/);
  return m ? { start: parseISO(m[1]), end: parseISO(m[2]) } : null;
}
// Working days Monday to Friday between two dates, both included (same count as the POAP automation).
function workdays(a, b) {
  if (b < a) return 0;
  let n = 0; const d = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  while (d <= b) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}
// Share of the programme between 1 Jan (or project start, if later) and the end of the month: as the leadership report.
// (H&S uses ytdShareTo, the same rule up to the report's status date.)
function ytdTimelineShare(tl, month) {
  if (!tl) return null;
  const [y, mo] = month.split('-').map(Number);
  const from = new Date(Math.max(tl.start, new Date(y, 0, 1))), to = new Date(Math.min(tl.end, new Date(y, mo, 0)));
  const total = workdays(tl.start, tl.end);
  if (!total) return to >= from ? 1 : 0;
  return Math.max(0, workdays(from, to) / total);
}

// Share of the programme between 1 Jan (or the programme start, if later) and the given date, in working days
function ytdShareTo(tl, date) {
  if (!tl) return null;
  const from = new Date(Math.max(tl.start, new Date(date.getFullYear(), 0, 1))), to = new Date(Math.min(tl.end, date));
  const total = workdays(tl.start, tl.end);
  if (!total) return to >= from ? 1 : 0;
  return Math.max(0, workdays(from, to) / total);
}

// POAP table of one project board (only read when the status week has no snapshot), cached until Refresh.
// Returns { groupTitle (lower case): { rowName (lower case): { total, planned, itd } } }; the first row of a name wins, as in the POAP workers.
const poapCache = new Map();
// The POAP groups' ids are remembered in this browser, so reads ask monday for those groups only instead of the whole
// project board (the programme groups are large and slow to read). Unknown or changed groups are looked up by title in
// one quick call; Refresh forgets them, so they are looked up again (e.g. a POAP group added since).
const POAP_GROUPS_KEY = 'holden-client-report-poap-groups';
const poapTitles = () => [...new Set(CONFIG.metrics.filter(m => m[1]).map(m => m[1].trim().toLowerCase()))];
function knownPoapGroups(key) { try { const j = JSON.parse(localStorage.getItem(POAP_GROUPS_KEY) || '{}')[key]; return Array.isArray(j) && j.length ? j.map(String) : null; } catch (e) { return null; } }
function rememberPoapGroups(key, ids) { try { const j = JSON.parse(localStorage.getItem(POAP_GROUPS_KEY) || '{}'); if (ids && ids.length) j[key] = ids; else delete j[key]; localStorage.setItem(POAP_GROUPS_KEY, JSON.stringify(j)); } catch (e) {} }
function forgetPoapGroups() { try { localStorage.removeItem(POAP_GROUPS_KEY); } catch (e) {} }
function loadPOAP(boardId) {
  const key = String(boardId);
  if (poapCache.has(key)) return poapCache.get(key);
  const PB = CONFIG.poap, cols = [PB.total, PB.planned, PB.actual], want = poapTitles();
  // project boards are multi-level: monday only returns their numbers when calculated values are asked for
  const read = groupIds => gql(`query ($ids: [ID!], $cols: [String!], $g: [String]) { boards(ids: $ids, hierarchy_types: [classic, multi_level]) { id groups(ids: $g) { id title
      items_page(limit: 100) { items { name column_values(ids: $cols, capabilities: [CALCULATED]) { id text } } } } } }`,
    { ids: [key], cols, g: groupIds });
  // The POAP groups' ids, found by title: one quick call that lists the board's groups without their items
  const lookup = async () => {
    const d = await gql('query ($ids: [ID!]) { boards(ids: $ids, hierarchy_types: [classic, multi_level]) { id groups { id title } } }', { ids: [key] });
    const b = (d.boards || [])[0];
    if (!b) throw new Error(`Project board ${key} was not found, or you don't have access to it.`);
    const ids = b.groups.filter(g => want.includes(g.title.trim().toLowerCase())).map(g => String(g.id));
    rememberPoapGroups(key, ids);
    return ids;
  };
  const p = (async () => {
    const t0 = performance.now(), known = knownPoapGroups(key);
    let b = null, how = 'remembered groups';
    if (known) {
      // still the same groups? (all ids found, and each is still a POAP group); if not, look them up again
      try {
        const x = ((await read(known)).boards || [])[0];
        if (x && x.groups && x.groups.length === known.length && x.groups.every(g => want.includes(g.title.trim().toLowerCase()))) b = x;
      } catch (e) { console.warn(LOG, 'Remembered POAP groups could not be read; looking them up again', e); }
    }
    if (!b) {
      how = 'groups looked up';
      const ids = await lookup();
      if (ids.length) b = ((await read(ids)).boards || [])[0];
      if (!b) { b = { groups: [] }; console.warn(LOG, `Project board ${key} has no POAP groups (${want.join(', ')}).`); }
    }
    console.info(`${LOG} POAP (${how}): ${b.groups.length} groups, ${Math.round(performance.now() - t0)} ms`);
    const tables = {};
    b.groups.forEach(g => {
      const rows = tables[g.title.trim().toLowerCase()] = {};
      g.items_page.items.forEach(it => {
        const n = id => { const c = it.column_values.find(x => x.id === id); return c && c.text !== '' && c.text != null ? num(c.text) : null; };
        const k = it.name.trim().toLowerCase();
        if (!rows[k]) rows[k] = { total: n(PB.total), planned: n(PB.planned), itd: n(PB.actual) };
      });
    });
    return tables;
  })();
  p.catch(e => { poapCache.delete(key); console.warn(LOG, 'POAP could not be read', e); });
  poapCache.set(key, p);
  return p;
}

// The project's weekly snapshot rows (all weeks), read by Project ID. { 'YYYY-MM-DD': { metric: { total, planned, itd } } }
const snapCache = new Map(), snapKnown = new Map();   // snapKnown: the rows once read, to decide without waiting
function loadSnapshots(projectId) {
  const key = String(projectId);
  if (snapCache.has(key)) return snapCache.get(key);
  const t0 = performance.now();
  const p = readSnapshots(key).then(out => { snapKnown.set(key, out); console.info(`${LOG} Snapshots: ${Object.keys(out).length} week(s), ${Math.round(performance.now() - t0)} ms`); return out; });
  p.catch(() => snapCache.delete(key));
  snapCache.set(key, p);
  return p;
}
async function readSnapshots(projectId) {
  const C = CONFIG.snapshot, cols = [C.weekEnding, C.metric, C.total, C.planned, C.toDate];
  const F = `cursor items { id column_values(ids: $c) { id text } }`;
  let d = await gql(`query ($b: [ID!], $c: [String!]) { boards(ids: $b) { items_page(limit: 500, query_params: { rules: [{ column_id: "${C.projectId}", compare_value: [${JSON.stringify(String(projectId))}], operator: any_of }] }) { ${F} } } }`,
    { b: [String(CONFIG.boards.snapshots)], c: cols });
  let page = ((d.boards || [])[0] || {}).items_page || { items: [] }, items = page.items;
  while (page.cursor) { d = await gql(`query ($cur: String!, $c: [String!]) { next_items_page(limit: 500, cursor: $cur) { ${F} } }`, { cur: page.cursor, c: cols }); page = d.next_items_page; items = items.concat(page.items); }
  const out = {};
  items.forEach(it => {
    const v = id => { const c = it.column_values.find(x => x.id === id); return c ? String(c.text || '').trim() : ''; };
    const n = id => { const s = v(id); return s === '' ? null : num(s); };
    const w = v(C.weekEnding).slice(0, 10), m = v(C.metric);
    if (w && m) (out[w] = out[w] || {})[m] = { total: n(C.total), planned: n(C.planned), itd: n(C.toDate) };
  });
  return out;
}

async function loadProgressHistory() {
  const H = CONFIG.progressHistory;
  // one call: the history rows with all their columns, and the column list the optional "Planned ahead" column
  // (planned % at the next Fridays, written by the programme snapshot) is found in by its title
  const b = await fetchBoard(CONFIG.boards.progressHistory, null);
  const ac = (b.columns || []).find(c => c.title.trim().toLowerCase() === H.plannedAheadTitle.toLowerCase());
  const ahead = ac ? ac.id : null;
  return b.items.map(it => ({
    boardId: val(it, H.projectBoardId), weekEnding: val(it, H.weekEnding).slice(0, 10),
    planned: num(val(it, H.planned)), actual: num(val(it, H.actual)), worstDelay: num(val(it, H.worstDelay)),
    tasksBehind: num(val(it, H.tasksBehind)), tasksTracked: num(val(it, H.tasksTracked)),
    // { total, rows: up to 10 packages, more: counts of the rest by status }; an older plain list is read as rows
    packages: (() => { try { const j = JSON.parse(val(it, H.packages) || 'null'); if (Array.isArray(j)) return { total: j.length, rows: j, more: { n: 0 } };
      return j && Array.isArray(j.rows) ? { total: j.total || j.rows.length, rows: j.rows, more: j.more || { n: 0 } } : null; } catch (e) { return null; } })(),
    topDelays: (() => { try { const j = JSON.parse(val(it, H.topDelays) || '[]'); return Array.isArray(j) ? j : []; } catch (e) { return []; } })(),
    plannedAhead: (() => { if (!ahead) return []; try { const j = JSON.parse(val(it, ahead) || '[]'); return Array.isArray(j) ? j.filter(x => x && x.w && x.p != null) : []; } catch (e) { return []; } })()
  })).filter(r => r.boardId && r.weekEnding);
}
const QUALITY_KINDS = ['benchmark', 'checksheet', 'handover'];
async function loadQuality() {
  const Q = CONFIG.quality;
  const boards = await Promise.all(QUALITY_KINDS.map(k => fetchBoard(Q[k].board, [Q[k].project, Q[k].due, Q[k].status])));
  const out = {};
  QUALITY_KINDS.forEach((k, i) => {
    out[k] = boards[i].items.map(it => ({ projectIds: links(it, Q[k].project), done: Q.doneLabels.includes(val(it, Q[k].status).toLowerCase()) }));
  });
  return out;
}

// The issued report whose period ends the day before this one starts, for PTD (ITD now − ITD at that report).
// If there is none, PTD shows "–" rather than covering a longer period than this report's.
function previousIssued(r) {
  const per = periodOf(r);
  if (!per) return null;
  const want = iso(addDays(per.w1, -1));
  return state.reports.filter(x => { const p = x.projectId === r.projectId && x.status === CONFIG.statusLabels.issued && periodOf(x); return p && iso(p.end) === want; })
    .sort((a, b) => b.revision - a.revision)[0] || null;
}

// The Friday of a date's week (snapshots are labelled with the week's Friday)
const fridayOf = d => addDays(d, (5 - d.getDay() + 7) % 7);

// Reads every source for one report in parallel. A source that fails only affects its own slides.
async function loadFigures(p, r) {
  const prev = previousIssued(r), per = periodOf(r);
  const statusWeek = iso(fridayOf(per ? per.status : new Date()));
  const settle = async jobs => { const keys = Object.keys(jobs), res = await Promise.allSettled(Object.values(jobs)), out = {};
    keys.forEach((k, i) => { out[k] = res[i].status === 'fulfilled' ? { value: res[i].value } : { error: (res[i].reason && res[i].reason.message) || String(res[i].reason) }; }); return out; };
  const liveJobs = () => { const j = {
    poap: p.boardId ? loadPOAP(p.boardId) : Promise.reject(new Error(`${p.code} has no Project Board ID on the Projects board, so its POAP table can't be read.`)),
    hs: loadSitePerformance() }; Object.values(j).forEach(x => x.catch(() => {})); return j; };
  // The live POAP read starts at the same time as the snapshot read instead of after it, unless the project's
  // snapshots are already known to cover the status week (then POAP isn't needed and isn't read).
  const known = snapKnown.get(String(p.id));
  let live = known && known[statusWeek] ? null : liveJobs();
  const src = await settle({
    snap: loadSnapshots(p.id), prog: loadProgressHistory(),
    prev: prev ? loadContent(prev.id).then(c => ({ report: prev, figures: (c.sections.figures || {})[CONFIG.kinds.issued] || null })) : Promise.resolve(null)
  });
  // no snapshot for the status week yet: the POAP table (and Site Performance) read live instead
  if (src.snap.error || !(src.snap.value || {})[statusWeek]) Object.assign(src, await settle(live || liveJobs()));
  return computeFigures(p, r, src);
}

// All figures for one report, as one object. Phase 5 freezes this object into the report when it is issued.
function computeFigures(p, r, src) {
  const per = periodOf(r);
  const asOf = iso(per ? per.status : new Date()), month = asOf.slice(0, 7);
  const statusWeek = iso(fridayOf(per ? per.status : new Date())), prevWeek = per ? iso(addDays(per.w1, -3)) : null;
  const f = { v: 2, asOf, month, weeks: per ? per.weeks : CONFIG.period.defaultWeeks, computedAt: new Date().toISOString(), errors: {} };
  const prevF = src.prev && src.prev.value ? src.prev.value.figures : null;
  f.prev = src.prev && src.prev.value ? { no: src.prev.value.report.no, hasFigures: !!prevF } : null;
  if (src.prev && src.prev.error) f.errors.prev = 'The previous report could not be read: ' + src.prev.error;

  // ---- the figures for the status week: the weekly snapshot, or POAP read live ----
  const snaps = (src.snap && src.snap.value) || {};
  let cur = snaps[statusWeek], mode = 'snapshot', liveError = null;
  if (!cur) {
    mode = 'live'; cur = {};
    if (src.poap && src.poap.value) CONFIG.metrics.forEach(([m, group, row]) => { if (group) { const g = src.poap.value[group.toLowerCase()]; const x = g && g[row.toLowerCase()]; if (x) cur[m] = x; } });
    else liveError = (src.poap && src.poap.error) || 'The POAP table could not be read.';
    if (src.hs && src.hs.value) {
      const mine = src.hs.value.filter(x => x.projectIds.includes(p.id) || (!x.projectIds.length && x.projectName === p.name));
      CONFIG.metrics.filter(m => !m[1]).forEach(([m, , , , key]) => { cur[m] = { total: null, planned: null, itd: mine.reduce((a, x) => a + x[key], 0) }; });
    }
  }
  const prevW = prevWeek ? snaps[prevWeek] : null;
  f.source = { mode, week: statusWeek, prevWeek, prevFound: !!prevW };
  const v = (m, k) => cur[m] ? cur[m][k] : null;
  // period figure: ITD now − ITD on the Friday before the period; else − ITD in the previous issued report
  const period = (m, kind, key) => {
    const a = v(m, 'itd'); if (a == null) return null;
    if (prevW && prevW[m] && prevW[m].itd != null) return a - prevW[m].itd;
    const pr = prevF && prevF[kind] && (kind === 'hs' ? { itd: (prevF.hs.y || {})[key] } : (prevF[kind].rows || []).find(x => x.key === key));
    return pr && pr.itd != null ? a - pr.itd : null;
  };
  ['design', 'commercial', 'quality'].forEach(kind => {
    const list = CONFIG.metrics.filter(x => x[3] === kind);
    if (mode === 'live' && liveError) { f.errors[kind] = liveError; return; }
    f[kind] = { rows: list.map(([m, , , , key, label]) => ({ key, label, total: v(m, 'total'), itd: v(m, 'itd'), ptd: period(m, kind, key) })) };
  });
  if (f.quality) f.quality.rows.push({ key: 'condition', label: 'Condition reports', total: null, itd: null, ptd: null, manual: true });
  // H&S, year to date (as the mockup):
  //   YTD = POAP ITD now − ITD in the last snapshot of the previous year (or ITD, if the programme started this year)
  //   YTD target = POAP Total (project target) × share of the programme from 1 Jan (or its start) to the status date
  const hsList = CONFIG.metrics.filter(x => x[3] === 'hs');
  if (mode === 'live' && liveError && !(src.hs && src.hs.value)) f.errors.hs = liveError;
  else {
    const statusD = per ? per.status : new Date(), yearStart = statusD.getFullYear() + '-01-01';
    const startedThisYear = !!(p.timeline && p.timeline.start >= new Date(statusD.getFullYear(), 0, 1));
    const yearEndWeek = Object.keys(snaps).filter(w => w < yearStart).sort().pop() || null;
    const base = startedThisYear ? null : (yearEndWeek ? snaps[yearEndWeek] : undefined);   // undefined = no figure for last year-end
    const y = {}, ptd = {}, target = {};
    hsList.forEach(([m, , , , key]) => {
      const itd = v(m, 'itd');
      y[key] = itd == null ? null : base && base[m] && base[m].itd != null ? itd - base[m].itd : itd;
      ptd[key] = period(m, 'hs', key);
    });
    const share = ytdShareTo(p.timeline, statusD);
    ['gcc', 'tbt', 'aud'].forEach(key => { const m = hsList.find(x => x[4] === key)[0], tot = v(m, 'total');
      target[key] = tot != null && share != null ? Math.round(tot * share) : null; });
    f.hs = { y, ptd, target, hasData: Object.values(y).some(x => x != null && x !== 0),
      ytd: startedThisYear ? 'this-year' : base ? 'year-end' : 'since-start', yearEndWeek, hasTimeline: !!p.timeline };
  }

  // Programme: weekly snapshots up to the status date
  if (src.prog.error) f.errors.prog = src.prog.error;
  else if (!p.boardId) f.errors.prog = `${p.code} has no Project Board ID on the Projects board.`;
  else {
    const rows = src.prog.value.filter(x => x.boardId === String(p.boardId) && x.weekEnding <= asOf).sort((a, b) => a.weekEnding.localeCompare(b.weekEnding));
    const cur = rows[rows.length - 1] || null;
    f.prog = {
      cur: cur ? { weekEnding: cur.weekEnding, planned: cur.planned, actual: cur.actual, worstDelay: cur.worstDelay, tasksBehind: cur.tasksBehind,
        tasksTracked: cur.tasksTracked, topDelays: cur.topDelays.slice(0, CONFIG.progressHistory.attentionCount), packages: cur.packages,
        ahead: (cur.plannedAhead || []).filter(x => x.w > cur.weekEnding).slice(0, 2) } : null,
      history: rows.slice(-CONFIG.progressHistory.chartWeeks).map(x => ({ w: x.weekEnding, p: x.planned, a: x.actual }))
    };
  }
  return f;
}

/* ================= Images: cover, drawings and progress photos (Phase 3) =================
   Files live in the File columns of the report item. The app reads them with the item's assets (needs the assets:read scope).
   Image links from monday are temporary, so they are read again whenever a report opens. */
const FILE_KEYS = ['cover', 'markup', 'keyPlan', 'lookahead', 'photos'];
const IMAGE_EXT = /^(png|jpe?g|gif|webp|bmp|svg)$/i;
const isImage = a => IMAGE_EXT.test(String(a.file_extension || '').replace(/^\./, '')) || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(a.name || '');
// Reads the File columns of the given items. Uses the column's own file list (FileValue) first; if that is empty,
// falls back to the column value's asset ids matched against the item's assets.
const FILES_QUERY = `query ($i: [ID!], $c: [String!]) { items(ids: $i) { id
  assets { id name public_url file_extension created_at }
  column_values(ids: $c) { id value
    ... on FileValue { files { ... on FileAssetValue { asset_id name asset { id name public_url file_extension created_at } } } } } } }`;
async function loadFiles(ids) {
  const R = CONFIG.report.files, cols = FILE_KEYS.map(k => R[k]);
  const d = await gql(FILES_QUERY, { i: ids.map(String), c: cols });
  const out = {};
  (d.items || []).forEach(it => {
    const byId = {}; (it.assets || []).forEach(a => { if (a) byId[String(a.id)] = a; });
    const o = {};
    FILE_KEYS.forEach(k => {
      const c = (it.column_values || []).find(x => x.id === R[k]) || {};
      let assets = (c.files || []).map(f => f && (f.asset || byId[String(f.asset_id)])).filter(Boolean);
      if (!assets.length) {
        let list = []; try { list = (JSON.parse(c.value || 'null') || {}).files || []; } catch (e) {}
        assets = list.map(f => byId[String(f.assetId)]).filter(Boolean);
      }
      o[k] = assets.filter(isImage).filter(a => a.public_url).map(a => ({ id: String(a.id), name: a.name, url: a.public_url, created: a.created_at }));
      o[k + 'Other'] = assets.filter(a => !isImage(a)).map(a => a.name);   // e.g. PDFs, which can't be shown on a slide
    });
    out[String(it.id)] = o;
  });
  return out;
}
// Console check: what monday returns for this report's File columns. ClientReport.filesCheck()
async function filesCheck() {
  const r = curReport(); if (!r) throw new Error('Open a report first.');
  const R = CONFIG.report.files;
  const d = await gql(FILES_QUERY, { i: [r.id], c: FILE_KEYS.map(k => R[k]) });
  const it = (d.items || [])[0] || {};
  const summary = {
    itemAssets: (it.assets || []).length,
    columns: FILE_KEYS.map(k => { const c = (it.column_values || []).find(x => x.id === R[k]) || {};
      return { column: FILE_COLUMN_TITLES[k], id: R[k], found: !!c.id, filesField: (c.files || []).length, valueFiles: (() => { try { return ((JSON.parse(c.value || 'null') || {}).files || []).length; } catch (e) { return 'unreadable'; } })(),
        withLink: (c.files || []).filter(f => f && f.asset && f.asset.public_url).length }; }),
    shownOnSlides: (await loadFiles([r.id]))[r.id]
  };
  console.info(LOG, 'Files check', summary, d);
  return summary;
}

// Cover and drawings show the newest file in their column, so uploading again replaces the image on the slide.
const newest = list => (list || []).reduce((a, f) => !a || String(f.created || '') >= String(a.created || '') ? f : a, null);
// This report's files, plus the cover image from the latest earlier report when this one has none.
const urlKeep = {};   // asset id -> { url, at }: monday's image links last an hour
function keepUrls(list) {
  (list || []).forEach(a => {
    const k = urlKeep[a.id];
    if (k && Date.now() - k.at < 45 * 60000) a.url = k.url; else urlKeep[a.id] = { url: a.url, at: Date.now() };
  });
}
async function loadReportFiles(r) {
  const earlier = state.reports.filter(x => x.projectId === r.projectId && (x.no < r.no || (x.no === r.no && x.revision < r.revision)))
    .sort((a, b) => b.no - a.no || b.revision - a.revision).slice(0, 6);
  const all = await loadFiles([r.id].concat(earlier.map(x => x.id)));
  Object.values(all).forEach(o => FILE_KEYS.forEach(k => keepUrls(o[k])));
  const cur = Object.assign({}, all[r.id] || {});
  // a revision has no files of its own (monday can't copy files between items): it uses the same report's earlier revision
  const sameNo = earlier.filter(x => x.no === r.no);
  ['markup', 'keyPlan', 'lookahead', 'photos'].forEach(k => {
    if ((cur[k] || []).length) return;
    const from = sameNo.find(x => ((all[x.id] || {})[k] || []).length);
    if (from) cur[k] = all[from.id][k];
  });
  let cover = newest(cur.cover), coverFrom = null;
  if (!cover) for (const x of earlier) { const c = newest((all[x.id] || {}).cover); if (c) { cover = c; coverFrom = x.no + (x.no === r.no && x.revision ? ' rev ' + x.revision : ''); break; } }
  return { reportId: r.id, cur, cover, coverFrom };
}

// Console check for the PDF export (Phase 4): can each image be copied into the page? ClientReport.imageTest()
async function imageTest() {
  const F = state.files;
  if (!F) throw new Error('Open a report first.');
  const list = [F.cover].concat(FILE_KEYS.filter(k => k !== 'cover').flatMap(k => F.cur[k] || [])).filter(Boolean).slice(0, 4);
  if (!list.length) return 'Upload an image to the report first.';
  const res = [];
  for (const a of list) {
    const r = { name: a.name };
    try { const resp = await fetch(a.url, { mode: 'cors' }); const b = await resp.blob(); Object.assign(r, { copyable: resp.ok, type: b.type, kb: Math.round(b.size / 1024) }); }
    catch (e) { Object.assign(r, { copyable: false, error: String(e.message || e) }); }
    res.push(r);
  }
  console.info(LOG, 'Image capture test', res);
  return res;
}

/* ================= Saved content: one subitem per section, kind and part =================
   Each section is saved as JSON, split into parts that fit a long text cell, and joined back in Part order.
   Section keys are slide ids ("ehs", "photos_2", ...) plus "layout" (slide order, hidden and duplicated slides). */
async function loadContent(reportId) {
  const P = CONFIG.parts;
  const d = await gql(`query ($i: [ID!], $c: [String!]) { items(ids: $i) { id subitems { id column_values(ids: $c) { id text value } } } }`,
    { i: [String(reportId)], c: [P.section, P.kind, P.part, P.content] });
  const subs = ((d.items || [])[0] || {}).subitems || [];
  const groups = {};
  subs.forEach(s => {
    const sec = val(s, P.section);
    if (!sec) return;
    const key = sec + '|' + (val(s, P.kind) || CONFIG.kinds.edits);
    (groups[key] = groups[key] || []).push({ id: String(s.id), part: num(val(s, P.part)) || 1, text: unwrapPart(longText(s, P.content)) });
  });
  const out = { reportId: String(reportId), sections: {}, parts: {}, problems: [] };
  for (const [key, arr] of Object.entries(groups)) {
    arr.sort((a, b) => a.part - b.part);
    out.parts[key] = arr;
    const [sec, kind] = key.split('|');
    try { (out.sections[sec] = out.sections[sec] || {})[kind] = JSON.parse(arr.map(x => x.text).join('')); }
    catch (e) { out.problems.push(`${sec} (${kind}): the saved content could not be read, so it was left out.`); }
  }
  return out;
}

// Parts are stored as plain ASCII, wrapped in ~…~: monday's long text trims spaces at the edges and may change
// characters like ’ – & <. Escaping them as \uXXXX keeps the JSON valid and the content exact.
const toAsciiJSON = data => JSON.stringify(data).replace(/[\u007f-\uffff<>&]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
const wrapPart = c => '~' + c + '~';
const unwrapPart = s => (s.length >= 2 && s[0] === '~' && s[s.length - 1] === '~') ? s.slice(1, -1) : s;

// Split by character (not code unit), so an accented letter or emoji is never cut in half.
function splitChunks(str, size) {
  const chars = Array.from(str), out = [];
  for (let i = 0; i < chars.length; i += size) out.push(chars.slice(i, i + size).join(''));
  return out;
}

// Saves one section. data = null removes it. Returns false if nothing changed.
async function saveSection(store, section, kind, data, opts) {
  const P = CONFIG.parts, key = section + '|' + kind;
  if (/\|/.test(section)) throw new Error('Section keys cannot contain "|".');
  const existing = store.parts[key] || [];
  const raw = data == null ? '' : toAsciiJSON(data);
  if (existing.map(x => x.text).join('') === raw) return false;
  const chunks = raw ? splitChunks(raw, CONFIG.chunkChars) : [];
  const ops = [];
  chunks.forEach((c, i) => {
    const ex = existing[i];
    if (ex) { if (ex.text !== c || ex.part !== i + 1) ops.push({ type: 'update', id: ex.id, vals: { [P.part]: String(i + 1), [P.content]: { text: wrapPart(c) } } }); }
    else ops.push({ type: 'create', name: `${section} · ${kind} · ${i + 1}`, vals: { [P.section]: section, [P.kind]: { labels: [kind] }, [P.part]: String(i + 1), [P.content]: { text: wrapPart(c) } } });
  });
  existing.slice(chunks.length).forEach(ex => ops.push({ type: 'delete', id: ex.id }));   // leftover parts, deleted last
  await runOps(store.reportId, ops);
  if (opts && opts.reload === false) return true;
  const fresh = await loadContent(store.reportId);
  Object.assign(store, fresh);
  return true;
}

// Writes up to 10 subitem changes per request.
async function runOps(reportId, ops) {
  for (let i = 0; i < ops.length; i += 10) {
    const batch = ops.slice(i, i + 10), defs = [], body = [], vars = {};
    let needParent = false, needBoard = false;
    batch.forEach((o, k) => {
      if (o.type === 'create') {
        needParent = true; defs.push(`$n${k}: String!`, `$v${k}: JSON!`); vars['n' + k] = o.name; vars['v' + k] = JSON.stringify(o.vals);
        body.push(`o${k}: create_subitem(parent_item_id: $p, item_name: $n${k}, column_values: $v${k}) { id }`);
      } else if (o.type === 'update') {
        needBoard = true; defs.push(`$i${k}: ID!`, `$v${k}: JSON!`); vars['i' + k] = o.id; vars['v' + k] = JSON.stringify(o.vals);
        body.push(`o${k}: change_multiple_column_values(board_id: $sb, item_id: $i${k}, column_values: $v${k}) { id }`);
      } else {
        defs.push(`$i${k}: ID!`); vars['i' + k] = o.id;
        body.push(`o${k}: delete_item(item_id: $i${k}) { id }`);
      }
    });
    if (needParent) { defs.unshift('$p: ID!'); vars.p = String(reportId); }
    if (needBoard) { defs.unshift('$sb: ID!'); vars.sb = String(CONFIG.boards.reportParts); }
    await gql(`mutation (${defs.join(', ')}) { ${body.join(' ')} }`, vars);
  }
}

// Console check: ClientReport.selfTest() saves a 6,400-character section, reads it back, then removes it.
async function selfTest() {
  if (!state.report) throw new Error('Select a report first.');
  const sample = { note: 'Storage self-test', text: 'Holden ’test’ – Data Hall 1, GL 8–12 & <level 2>. '.repeat(130) };
  const store = await loadContent(state.report);
  await saveSection(store, '_selftest', CONFIG.kinds.edits, sample);
  const key = '_selftest|' + CONFIG.kinds.edits;
  const parts = (store.parts[key] || []).length;
  const back = (store.sections._selftest || {})[CONFIG.kinds.edits];
  const a = JSON.stringify(sample), b = back === undefined ? '' : JSON.stringify(back);
  const ok = a === b;
  let firstDiff = null;
  if (!ok) {
    // where the stored text stops matching, to see what monday changed
    const raw = toAsciiJSON(sample), got = (store.parts[key] || []).map(x => x.text).join('');
    let i = 0; while (i < raw.length && raw[i] === got[i]) i++;
    firstDiff = { at: i, saved: raw.slice(Math.max(0, i - 20), i + 20), readBack: got.slice(Math.max(0, i - 20), i + 20), problems: store.problems };
  }
  await saveSection(store, '_selftest', CONFIG.kinds.edits, null);
  const result = { ok, parts, characters: a.length, cleanedUp: !store.parts[key], firstDiff };
  console.info(LOG, 'Storage self-test', result);
  return result;
}

/* ================= Edits: everything typed into the report =================
   state.edits is the working copy of every saved "Edits" section (key = slide id, plus "layout").
   state.savedText is what was last loaded or saved, so the app knows what changed. */
const EDIT_SKIP = ['_selftest', 'figures'];
const deepCopy = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
function editsFrom(content) {
  const out = {};
  Object.entries(content.sections).forEach(([k, kinds]) => { if (!EDIT_SKIP.includes(k) && kinds[CONFIG.kinds.edits] !== undefined) out[k] = deepCopy(kinds[CONFIG.kinds.edits]); });
  return out;
}
const snapshotOf = edits => { const o = {}; Object.keys(edits).forEach(k => { o[k] = JSON.stringify(edits[k]); }); return o; };
const changedKeys = () => !state.edits ? [] : [...new Set(Object.keys(state.edits).concat(Object.keys(state.savedText || {})))]
  .filter(k => JSON.stringify(state.edits[k]) !== state.savedText[k]);
const isDirty = () => changedKeys().length > 0;
const canEdit = r => !!r && [CONFIG.statusLabels.draft, CONFIG.statusLabels.review].includes(r.status);
const E = sid => (state.edits && state.edits[sid]) || {};
const getPath = (o, path) => path.reduce((a, k) => a == null ? undefined : a[k], o);
function setPath(sid, path, v) {
  if (!state.edits[sid]) state.edits[sid] = {};
  let o = state.edits[sid];
  path.slice(0, -1).forEach((k, i) => { if (o[k] == null) o[k] = typeof path[i + 1] === 'number' ? [] : {}; o = o[k]; });
  o[path[path.length - 1]] = v;
}
// Typed numbers: currency signs, commas and spaces are ignored ("€12,400" = 12400)
const toNumOrNull = s => { const t = String(s == null ? '' : s).replace(/[^0-9.\-]/g, ''); if (t === '' || t === '-' || t === '.') return null; const n = parseFloat(t); return isNaN(n) ? null : n; };
const linesOf = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);

// Tables with default rows are filled in the first time they are edited (not just by opening edit mode).
const RES_DEFAULT = ['Contracts Manager', 'Project Manager', 'Site Manager', 'Site Supervisor', 'Quantity Surveyor', 'Design Manager', 'Design Technician',
  'Panel Installers', 'Panel Opes', 'Wall (stud) Installers', 'Mesh Installers', 'Ceiling/HAC Installers', 'Flooring Finishers'];
const PLANT_DEFAULT = ['MEWP', 'Reach trucks', 'Cladboy'];
const DELIVERY_GROUPS = ['Stud wall deliveries', 'Ceiling deliveries', 'Mesh deliveries', 'Whitewall deliveries'];
const ENSURE = {
  resources: e => {
    if (!e.res) e.res = RES_DEFAULT.map(t => ({ t, v: [] }));
    if (!e.plant) e.plant = PLANT_DEFAULT.map(t => ({ t, v: [] }));
    if (!e.deliv) e.deliv = DELIVERY_GROUPS.map(name => ({ name, rows: [] }));
  }
};
function typeOf(sid) { const s = currentLayout().slides.find(x => x.id === sid); return s ? s.type : String(sid).split('_')[0]; }
function ensureSection(sid) { if (!state.edits[sid]) state.edits[sid] = {}; const f = ENSURE[typeOf(sid)]; if (f) f(state.edits[sid]); }

/* ================= Layout: slide order, hidden and duplicated slides (saved as section "layout") ================= */
function currentLayout() {
  const L = state.edits && state.edits.layout;
  const slides = L && Array.isArray(L.slides) && L.slides.length ? L.slides.filter(s => s && NAME[s.type] && s.id) : DEFAULT_SLIDES;
  return { slides, hidden: (L && L.hidden) || {} };
}
// Numbers each section in the order it appears; numbering and contents follow the slides included.
// In edit mode the list also holds hidden slides, so they can be shown again.
function decorate(layout, editing) {
  const visible = layout.slides.filter(s => !layout.hidden[s.id]);
  const nums = {}; let n = 0;
  visible.forEach(s => { const g = GROUP[s.type]; if (g && !(g in nums)) nums[g] = ++n; });
  const seen = {};
  const list = (editing ? layout.slides : visible).map(s => {
    const g = GROUP[s.type], cont = !!seen[s.type];
    seen[s.type] = true;
    const title = g ? `${nums[g] ? nums[g] + '. ' : ''}${g}${cont && s.type === 'photos' ? ' (cont.)' : ''}` : s.type === 'contents' ? 'Contents' : '';
    return Object.assign({}, s, { title, tab: NAME[s.type] + (cont ? ' (cont.)' : ''), hidden: !!layout.hidden[s.id] });
  });
  return { list, contents: Object.keys(nums).map(g => ({ n: nums[g], label: g })) };
}
function setLayout(fn) {
  const L = currentLayout();
  const next = { slides: L.slides.map(s => ({ id: s.id, type: s.type })), hidden: Object.assign({}, L.hidden) };
  fn(next);
  Object.keys(next.hidden).forEach(k => { if (!next.hidden[k] || !next.slides.some(s => s.id === k)) delete next.hidden[k]; });
  state.edits.layout = next;
}
const NO_COPY = ['cover', 'contents', 'appendix'];
function newSlideId(type) {
  const ids = currentLayout().slides.map(s => s.id);
  let n = 2; while (ids.includes(type + '_' + n)) n++;
  return type + '_' + n;
}

/* ================= Slide rendering ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wordmark = (h) => WORDMARK ? `<img src="${WORDMARK}" alt="Holden" style="height: ${h}px; width: auto; display: block">`
  : `<span class="wmt" style="font-size: ${Math.round(h * 0.95)}px; line-height: 1">HOLDEN</span>`;

// ---- editable fields: a field shows its value, or an input in edit mode. Paths are stored as JSON in data-k.
const dk = (sid, path) => `data-sec="${esc(sid)}" data-k="${esc(JSON.stringify(path))}"`;
function field(ctx, sid, path, fallback, opt) {
  opt = opt || {};
  const v = getPath(E(sid), path), value = v == null ? (fallback == null ? '' : fallback) : v;
  if (!ctx.editing) return opt.view ? opt.view(value) : (String(value).trim() === '' ? (opt.empty == null ? '' : opt.empty) : esc(value));
  return `<input class="${opt.cls || 'ce'}" type="text" ${dk(sid, path)} value="${esc(value)}" aria-label="${esc(opt.label || '')}"${opt.placeholder ? ` placeholder="${esc(opt.placeholder)}"` : ''} style="${opt.style || ''}">`;
}
const cellField = (ctx, sid, path, label, align) => field(ctx, sid, path, '', { label, empty: '–', style: `text-align: ${align || 'center'}` });
function bullets(lines, style) {
  return lines.length ? `<ul class="bl" style="${style || ''}">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '<div class="empty-hint">Nothing added yet.</div>';
}
function area(ctx, sid, path, label, opt) {
  opt = opt || {};
  const v = getPath(E(sid), path) || '';
  if (!ctx.editing) return bullets(linesOf(v), opt.listStyle);
  return `<textarea class="ta" ${dk(sid, path)} aria-label="${esc(label)}, one point per line" placeholder="One point per line" style="min-height: 40px; ${opt.style || ''}">${esc(v)}</textarea>`;
}
const commentsCard = (ctx, sid, title, style) => `<div class="card" style="${style || ''}"><div class="ch">${esc(title)}</div>${area(ctx, sid, ['comments'], title)}</div>`;
const addBtn = (sid, path, tpl, label) => `<button type="button" class="addrow" data-act="add" ${dk(sid, path)} data-tpl="${esc(JSON.stringify(tpl))}">${esc(label)}</button>`;
const delBtn = (sid, path, i, label) => `<button type="button" class="xb" data-act="del" ${dk(sid, path)} data-i="${i}" aria-label="${esc(label)}">×</button>`;

function hdr(s, ctx) {
  const n = ctx.per ? ctx.per.weeks : CONFIG.period.defaultWeeks;
  const k = s.type === 'lookahead' || s.type === 'resources' ? nextWeeks(n) : SUBKICK[s.type];
  const sub = k ? ' | ' + k : '';
  return `<div class="hdr"><img class="mono" src="${LOGO}" alt=""><div><div class="kick">${esc(ctx.code)} | Report ${ctx.no}${esc(sub)}</div><h2 class="ttl">${esc(s.title)}</h2></div></div>`;
}
const ftr = ctx => `<div class="ftr"><span>${esc(ctx.code)} ${cadenceName(ctx.per ? ctx.per.weeks : CONFIG.period.defaultWeeks)} Progress Report | Report ${ctx.no} | ${ctx.per ? fDMY(ctx.per.end) : ''}</span>${wordmark(17)}</div>`;
const frame = (s, ctx, body, bodyStyle, bodyClass) => `<section class="slide">${hdr(s, ctx)}<div class="body${bodyClass ? ' ' + bodyClass : ''}" style="${bodyStyle || ''}">${body}</div>${ftr(ctx)}</section>`;

// An image slot: the picture, or a placeholder; in edit mode an Upload / Replace button for its File column.
function uploadBtn(ctx, key, has, label, small) {
  if (!ctx.editing) return '';
  const st = small ? 'height: 28px; font-size: 12.5px; padding: 0 10px' : '';
  const up = `<button type="button" class="upl" data-upload="${key}" style="${st}">${esc(has ? 'Replace' : label)}</button>`;
  return has ? up + `<button type="button" class="upl" data-remove="${key}" style="${st}">Remove</button>` : up;
}
const imgTag = (a, fit, alt) => `<img src="${esc(a.url)}" data-asset="${esc(a.id)}" alt="${esc(alt || a.name)}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: ${fit}">`;
function filesNote(ctx, key) {

  return ctx.editing && other && other.length ? `<div class="err" style="position: absolute; left: 8px; right: 8px; bottom: 8px; font-size: 12px; padding: 6px 8px; z-index: 3">${esc(other.join(', '))} can't be shown on a slide. Please upload a picture (PNG or JPG) instead.</div>` : '';
}

function comingBody(s) {

/* ---------- Data slides ---------- */
const fmtN = n => n == null ? '–' : Number(n).toLocaleString('en-IE');
const pctOf = (a, b) => a != null && b ? Math.round(a / b * 100) : null;
const clamp = v => Math.max(0, Math.min(100, v || 0));
const barHTML = (p, color, tick) => `<div class="pb"><div class="pf" style="width: ${clamp(p)}%${color ? '; background: ' + color : ''}"></div>${tick != null ? `<div class="pt" style="left: ${clamp(tick)}%"></div>` : ''}</div>`;
const barCell = (pc, color) => pc == null ? '<span class="pc" style="flex: 1; text-align: center">–</span>' : barHTML(pc, color) + `<span class="pc">${pc}%</span>`;
const errBox = t => `<div class="err" style="font-size: 12.5px; padding: 8px 10px">${esc(t)}</div>`;
const noteLine = t => `<div style="font-size: 12px; color: #5B6472; margin-top: 8px">${esc(t)}</div>`;
const loadingBody = t => `<div class="note" style="margin: auto">${esc(t || 'Loading figures…')}</div>`;
// The blue "Source: POAP table…" note under the figure tables was removed (not wanted). The figures' source is still in ClientReport.state.figs.source.
const srcNote = () => '';

// Total / period / ITD / Progress table used by Design, Quality and Procurement. A row may carry typed-in cells (r.html).
function progressTable(rows, color, cols, withTotal, head) {
  const cell = (r, k) => r.html && r.html[k] != null ? r.html[k] : fmtN(r[k]);
  const cells = rows.map(r => `<div class="mc mi" style="padding: 12px 10px">${esc(r.label)}</div><div class="mc">${cell(r, 'total')}</div><div class="mc">${cell(r, 'ptd')}</div>
    <div class="mc" style="font-weight: 700">${cell(r, 'itd')}</div><div class="mc" style="gap: 8px">${barCell(pctOf(r.itd, r.total))}</div>`).join('');
  let tot = '';
  if (withTotal) {
    const s = k => rows.every(r => r[k] == null) ? null : rows.reduce((a, r) => a + (r[k] || 0), 0);
    const b = 'font-weight: 700; border-bottom: 0';
    tot = `<div class="mc mi" style="${b}">Total</div><div class="mc" style="${b}">${fmtN(s('total'))}</div><div class="mc" style="${b}">${fmtN(s('ptd'))}</div><div class="mc" style="${b}">${fmtN(s('itd'))}</div><div class="mc" style="border-bottom: 0"></div>`;
  }
  return `<div class="mt" style="grid-template-columns: ${cols}; border-left-color: ${color}"><div class="mh mi">Item</div><div class="mh">Total</div><div class="mh">${esc(head || 'PTD')}</div><div class="mh">ITD</div><div class="mh">Progress to date</div>${cells}${tot}</div>`;
}

function hsBody(f, ctx, s) {
  const comments = commentsCard(ctx, s.id, 'Health & safety comments');
  if (!f.hs) return `<div class="col">${errBox(f.errors.hs)}</div>${comments}`;
  const H = f.hs;
  const lead = [['Good catch cards (GCC)', 'gcc'], ['Toolbox talks (TBT)', 'tbt'], ['H&S audits', 'aud']].map(([l, k]) => {
    const t = H.target[k], pc = pctOf(H.y[k], t);
    return `<div class="mc mi">${l}</div><div class="mc">${fmtN(H.ptd[k])}</div><div class="mc" style="font-weight: 700">${fmtN(H.y[k])}</div><div class="mc">${fmtN(t)}</div>
      <div class="mc" style="gap: 8px">${barCell(pc, pc >= 100 ? '#1E7A46' : '#B45309')}</div>`;
  }).join('');
  const rate = k => H.y.hours ? (H.y[k] * 100000 / H.y.hours).toFixed(1) : '–';
  const lag = [['Incidents', 'inc'], ['Lost time injuries (LTI)', 'lti'], ['Near misses', 'nm'], ['Non-compliances', 'nc']].map(([l, k]) =>
    `<div class="mc mi">${l}</div><div class="mc">${fmtN(H.ptd[k])}</div><div class="mc" style="font-weight: 700">${fmtN(H.y[k])}</div><div class="mc">${rate(k)}</div>`).join('');
  const gaps = [];
  if (!H.hasData) gaps.push('No H&S figures for this project yet.');
  if (Object.values(H.target).every(x => x == null)) gaps.push(H.hasTimeline ? 'YTD targets need the H&S Total (project target) in the POAP table.' : 'YTD targets need the Programme Timeline on the Projects board.');
  return `<div class="col">
    <div><div class="gt" style="color: #1F7FB8">Leading indicators</div>
      <div class="mt" style="grid-template-columns: minmax(0, 1.2fr) 90px 74px 90px minmax(120px, 1fr); border-left-color: #66CCFF">
        <div class="mh mi">Item</div><div class="mh">${periodHead(f.weeks)}</div><div class="mh">YTD</div><div class="mh">YTD target</div><div class="mh">Against target</div>${lead}</div></div>
    <div><div class="gt" style="color: #1F7FB8">Lagging indicators</div>
      <div class="mt" style="grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); border-left-color: #66CCFF">
        <div class="mh mi">Item</div><div class="mh">${periodHead(f.weeks)}</div><div class="mh">YTD</div><div class="mh">Rate per 100,000 hrs (YTD)</div>${lag}</div>
      ${noteLine(`Hours worked: ${fmtN(H.y.hours)}. YTD: year to date.`)}${srcNote(f, true)}
      ${gaps.length ? noteLine(gaps.join(' ')) : ''}</div>
  </div>${comments}`;
}

     <div class="mc" style="padding: 5px 8px; font-weight: 700">${cellField(ctx, sid, ['rfi', i, 'b'], l + ', to date')}</div>`).join('');
